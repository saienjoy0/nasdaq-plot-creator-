name: WS7 Bootstrap Canon SHA

on:
  push:
    branches:
      - hardening/ws7-canon-manifest
    paths:
      - ".github/workflows/ws7-bootstrap-canon-sha.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compute exact direct-document SHA-256 values
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          for key, rel in {
              "01": "source-of-truth/01_fox_character_bible.md",
              "02": "source-of-truth/02_editorial_bible.md",
          }.items():
              data = (root / rel).read_bytes()
              print(f"CANON_SHA_{key}={hashlib.sha256(data).hexdigest()}")
              print(f"CANON_BYTES_{key}={len(data)}")
