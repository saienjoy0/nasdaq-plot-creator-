name: Current Spine PR-2 Contract Fix

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".current-spine/fix_pr2_contract_tests.py"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Align PR-2 contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/fix_pr2_contract_tests.py
          python3 -m py_compile \
            scripts/run_daily_renderer_closure_v12.py \
            tests/chatgpt-semantic-freeze/test_chatgpt_semantic_freeze.py
          rm -f .current-spine/fix_pr2_contract_tests.py .github/workflows/current-spine-pr2-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-2: align semantic freeze and closure contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
