name: Editorial Memory Seed 2026-07-31

on:
  push:
    branches:
      - "feat/pr4-seed-2026-07-31"
    paths:
      - "memory-seeds/2026-07-31/seed_manifest.json"
      - "scripts/materialize_memory_seed.py"
      - ".github/workflows/editorial-memory-seed-2026-07-31.yml"
  pull_request:
    paths:
      - "memory-seeds/2026-07-31/**"
      - "scripts/materialize_memory_seed.py"
      - "editorial-memory/episodes/2026-07-31/**"
      - "editorial-memory/daily/2026-07-31.md"
      - "editorial-memory/threads/ai-capex-payback.md"
      - "editorial-memory/threads/index.json"
      - "editorial-memory/claim_ledger.json"
      - "editorial-memory/entity_aliases.json"
      - ".github/workflows/editorial-memory-seed-2026-07-31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile seed and promotion scripts
        run: |
          python -m py_compile \
            scripts/materialize_memory_seed.py \
            scripts/memory_promotion_common.py \
            scripts/memory_promotion_preflight.py \
            scripts/memory_promotion_conflicts.py \
            scripts/memory_promotion_merge.py \
            scripts/memory_promotion_planner.py \
            scripts/memory_promotion_apply.py \
            scripts/memory_promotion_lib.py \
            scripts/plan_memory_promotion.py \
            scripts/apply_memory_promotion.py

      - name: Materialize pinned approved episode memory
        run: |
          python scripts/materialize_memory_seed.py \
            memory-seeds/2026-07-31/seed_manifest.json \
            --apply

      - name: Validate contracts and promotion safety
        run: |
          python skills/nasdaq-cafe-editorial-memory/validators/validate_memory_contracts.py --require-jsonschema
          python -m unittest discover -s tests/memory-promotion -p 'test_*.py' -v

      - name: Verify seeded memory contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          episode_root = Path("editorial-memory/episodes/2026-07-31")
          archive = episode_root / "revisions/v001"
          index = json.loads((episode_root / "index.json").read_text(encoding="utf-8"))
          provenance = json.loads((archive / "provenance.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("editorial-memory/claim_ledger.json").read_text(encoding="utf-8"))
          threads = json.loads(Path("editorial-memory/threads/index.json").read_text(encoding="utf-8"))
          aliases = json.loads(Path("editorial-memory/entity_aliases.json").read_text(encoding="utf-8"))
          report = json.loads(Path("memory-seeds/2026-07-31/seed_report.json").read_text(encoding="utf-8"))

          assert index["current_revision"] == "v001"
          assert index["revisions"] == ["v001"]
          assert report["status"] == "verified"
          assert report["repeat_result"] == "noop"
          assert [item["claim_id"] for item in ledger["claims"]] == ["ai-capex-evaluation-axis"]
          assert [item["id"] for item in threads["threads"]] == ["ai-capex-payback"]
          assert sorted(item["entity_id"] for item in aliases["entities"]) == [
              "amazon", "amazon-web-services", "apple", "soxx"
          ]
          assert provenance["generated_memory_ids"]["threads"] == ["ai-capex-payback"]
          assert provenance["generated_memory_ids"]["claims"] == ["ai-capex-evaluation-axis"]
          assert sorted(provenance["generated_memory_ids"]["aliases"]) == [
              "amazon", "amazon-web-services", "apple", "soxx"
          ]
          PY

      - name: Verify the current retrieval prototype can find the seed
        run: |
          python scripts/build_memory_context.py \
            --date 2026-08-01 \
            --topic "AI設備投資" \
            --entity "AWS" \
            --output working/seeded_memory_context.md
          grep -F "AI設備投資の回収" working/seeded_memory_context.md
          grep -F "ai-capex-evaluation-axis" working/seeded_memory_context.md

      - name: Commit deterministic seed outputs to the feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            memory-seeds/2026-07-31/publication_record.json \
            memory-seeds/2026-07-31/seed_report.json \
            memory-seeds/2026-07-31/source/episode_package_2026-07-31.md \
            memory-seeds/2026-07-31/source/render_spec.json \
            memory-seeds/2026-07-31/source/validator_report.json \
            editorial-memory/episodes/2026-07-31 \
            editorial-memory/daily/2026-07-31.md \
            editorial-memory/threads/ai-capex-payback.md \
            editorial-memory/threads/index.json \
            editorial-memory/claim_ledger.json \
            editorial-memory/entity_aliases.json
          if git diff --cached --quiet; then
            echo "Seed outputs already committed"
          else
            git commit -m "Seed approved 2026-07-31 editorial memory [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Confirm PR branch is reproducible
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- \
            memory-seeds/2026-07-31 \
            editorial-memory/episodes/2026-07-31 \
            editorial-memory/daily/2026-07-31.md \
            editorial-memory/threads/ai-capex-payback.md \
            editorial-memory/threads/index.json \
            editorial-memory/claim_ledger.json \
            editorial-memory/entity_aliases.json
