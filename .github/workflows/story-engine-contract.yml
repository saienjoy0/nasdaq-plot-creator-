name: Story Engine Contract
on:
  pull_request:
    paths:
      - 'skills/nasdaq-cafe-story-engine/**'
      - 'skills/nasdaq-cafe-story-plan/**'
      - 'skills/nasdaq-cafe-story-authoring/**'
      - 'skills/nasdaq-cafe-entertainment-critic/**'
      - 'scripts/story-engine/**'
      - 'critic-adapters/openai/**'
      - 'tests/story-engine/test_story_engine.py'
      - 'tests/story-engine/test_story_engine_2026_08_06_fixture.py'
      - 'tests/story-engine/fixtures/2026-08-06/**'
      - 'tests/story-engine/fixtures/2026-08-10-interest/**'
      - 'tests/story-engine/run_2026_08_10_interest_regression.py'
      - 'tests/story-engine/run_2026_08_10_interest_regression_v2.py'
      - 'tests/story-engine/test_committed_valid_fixtures.py'
      - 'tests/story-engine/test_understanding_progression_review.py'
      - 'tests/story-engine/test_interest_quality_policy.py'
      - 'tests/story-engine-integration/test_optional_external_critic_policy.py'
      - 'tests/story-engine-integration/test_display_text.py'
      - 'tests/story-engine-integration/test_openai_critic_adapter.py'
      - 'tests/story-engine-integration/test_openai_critic_interest_policy.py'
      - 'tests/story-plan/**'
      - 'tests/real-day-2026-08-10/**'
      - 'tests/fixtures/real-day-2026-08-10/**'
      - 'working/2026-08-06/story-engine/templates/**'
      - 'designs/STORY_ENGINE_UNIFIED_FINAL_DESIGN_v1.1.md'
      - 'designs/STORY_ENGINE_UNDERSTANDING_PROGRESSION_DESIGN_v1.1.md'
      - 'designs/STORY_ENGINE_LATE_VALUE_HARDENING_v1.0.md'
      - 'designs/STORY_ENGINE_INFORMATION_GAIN_INTEREST_DESIGN_v1.0.md'
      - '.github/workflows/story-engine-contract.yml'
  workflow_dispatch:
permissions: {contents: read}
env:
  ACCEPTANCE_FIXTURE_COMMIT: b986888660aa8efd64428aa8119200965351c047
jobs:
  test:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable 2026-08-10 acceptance fixture
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/nasdaq-plot-creator-
          ref: ${{ env.ACCEPTANCE_FIXTURE_COMMIT }}
          path: .acceptance-fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install jsonschema pytest openai
      - name: Compile Interest A-B regression
        run: |
          python -m py_compile tests/story-engine/fixtures/2026-08-10-interest/materialize_revised_interest_fixture.py
          python -m py_compile tests/story-engine/fixtures/2026-08-10-interest/materialize_revised_interest_fixture_v2.py
          python -m py_compile tests/story-engine/run_2026_08_10_interest_regression.py
          python -m py_compile tests/story-engine/run_2026_08_10_interest_regression_v2.py
      - run: python tests/story-engine/test_story_engine.py
      - run: python tests/story-engine/test_committed_valid_fixtures.py
      - run: pytest -q tests/story-plan/test_story_plan.py tests/story-plan/test_story_plan_migration.py tests/story-plan/test_story_plan_2026_08_10_regression.py tests/story-engine/test_story_engine_2026_08_06_fixture.py tests/story-engine/test_understanding_progression_review.py tests/story-engine/test_interest_quality_policy.py tests/story-engine-integration/test_optional_external_critic_policy.py tests/story-engine-integration/test_display_text.py tests/story-engine-integration/test_openai_critic_adapter.py tests/story-engine-integration/test_openai_critic_interest_policy.py
      - name: Run real historical H4 versus revised Interest A-B
        run: |
          python tests/story-engine/run_2026_08_10_interest_regression_v2.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --acceptance-source "$GITHUB_WORKSPACE/.acceptance-fixture" \
            --output "$GITHUB_WORKSPACE/verification/2026-08-10/story_interest_regression.json"
