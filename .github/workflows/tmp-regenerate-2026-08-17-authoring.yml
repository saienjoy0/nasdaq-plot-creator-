name: TEMP Regenerate 2026-08-17 Authoring

on:
  push:
    branches:
      - production/2026-08-17-scene9-chunk-fix

permissions:
  contents: write

jobs:
  regenerate:
    if: startsWith(github.event.head_commit.message, 'TEMP:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema referencing

      - name: Apply explicit Scene 9 two-beat narration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          date = '2026-08-17'
          closing_a = '以上、朝のNASDAQカフェでした。今日も気をつけて、いってらっしゃい。'
          closing_b = 'こちらはそろそろ、おやすみなさい。'
          closing = closing_a + closing_b

          production_path = Path(f'daily-authoring-parts/{date}/08_scenes_c.json')
          production_part = json.loads(production_path.read_text(encoding='utf-8'))
          prod_scene = production_part['production']['scenes'][-1]
          assert prod_scene['sceneRole'] == 'fixed_closing'
          assert len(prod_scene['beats']) == 2
          assert len(prod_scene['chunks']) == 1
          assert prod_scene['chunks'][0]['text'] == closing
          prod_scene['chunks'] = [
              {'expression': '通常', 'text': closing_a},
              {'expression': '通常', 'text': closing_b},
          ]
          production_path.write_text(json.dumps(production_part, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          story_matches = []
          for path in sorted(Path(f'daily-authoring-parts/{date}').glob('*.json')):
              value = json.loads(path.read_text(encoding='utf-8'))
              story = value.get('storyScript') if isinstance(value, dict) else None
              if isinstance(story, dict):
                  story_matches.append((path, value, story))
          assert len(story_matches) == 1, [str(row[0]) for row in story_matches]
          story_path, story_part, story = story_matches[0]
          story_scene = story['scenes'][-1]
          assert story_scene['scene_id'] == 'scene-09'
          assert story_scene['formal_role'] == 'fixed_closing'
          assert story_scene['narration'] == closing
          story_scene['narration'] = closing_a + '\n\n' + closing_b
          story_path.write_text(json.dumps(story_part, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('.scene9_story_part_path').write_text(story_path.as_posix() + '\n', encoding='utf-8')
          print(f'Patched production chunks: {production_path}')
          print(f'Patched canonical Story Script source: {story_path}')
          PY

      - name: Reassemble canonical Daily Authoring v2
        run: python3 scripts/assemble_chatgpt_daily_authoring_parts.py --date 2026-08-17 --repo-root .

      - name: Reissue official Editorial Semantic Acceptance
        run: python3 scripts/validate_editorial_semantic_boundary.py --date 2026-08-17 --repo-root .

      - name: Recreate and verify Semantic Freeze v1.2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/chatgpt_semantic_freeze.py --repo-root . create --date 2026-08-17
          python3 scripts/chatgpt_semantic_freeze.py --repo-root . verify --date 2026-08-17 --manifest semantic-freezes/2026-08-17.json

      - name: Verify exact Scene 9 meaning and 1:1 presentation alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          closing_a = '以上、朝のNASDAQカフェでした。今日も気をつけて、いってらっしゃい。'
          closing_b = 'こちらはそろそろ、おやすみなさい。'
          value=json.loads(Path('daily-authoring/2026-08-17.json').read_text(encoding='utf-8'))
          scenes=value['production']['scenes']
          assert len(scenes) == 9
          assert sum(len(s['beats']) for s in scenes) == 18
          for i, scene in enumerate(scenes, 1):
              assert len(scene['chunks']) == len(scene['beats']), (i, len(scene['chunks']), len(scene['beats']))
          scene9=scenes[-1]
          assert [c['text'] for c in scene9['chunks']] == [closing_a, closing_b]
          assert value['storyScript']['scenes'][-1]['narration'] == closing_a + '\n\n' + closing_b
          assert ''.join(c['text'] for c in scene9['chunks']) == closing_a + closing_b
          print('PASS: words unchanged; 9 scenes / 18 beats; Scene 9 has 2 beats and 2 explicit chunks')
          PY

      - name: Commit only regenerated semantic-chain files
        shell: bash
        run: |
          set -euo pipefail
          STORY_PART="$(cat .scene9_story_part_path)"
          git add "$STORY_PART"
          git add daily-authoring-parts/2026-08-17/08_scenes_c.json
          git add daily-authoring/2026-08-17.json
          git add verification/2026-08-17/editorial-semantic-preflight/story_script.json
          git add verification/2026-08-17/editorial_semantic_acceptance.json
          git add semantic-freezes/2026-08-17.json

          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          story_part=Path('.scene9_story_part_path').read_text(encoding='utf-8').strip()
          expected=sorted([
              story_part,
              'daily-authoring-parts/2026-08-17/08_scenes_c.json',
              'daily-authoring/2026-08-17.json',
              'verification/2026-08-17/editorial-semantic-preflight/story_script.json',
              'verification/2026-08-17/editorial_semantic_acceptance.json',
              'semantic-freezes/2026-08-17.json',
          ])
          actual=sorted(filter(None, subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()))
          assert actual == expected, {'expected': expected, 'actual': actual}
          print('Staged exact files:')
          print('\n'.join(actual))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix 2026-08-17 Scene 9 chunk alignment"
          git push origin HEAD:production/2026-08-17-scene9-chunk-fix
