name: PR-A Workflow Projection Bootstrap

on:
  push:
    branches:
      - hardening/editorial-semantic-boundary-v1-3
    paths:
      - '.github/workflows/pr-a-bootstrap.yml'

permissions:
  contents: write

jobs:
  project-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the two already-tested workflow projections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor; found={text.count(old)}')
              return text.replace(old, new, 1)

          out = Path('.pr-a-generated')
          out.mkdir(exist_ok=True)

          # daily-renderer-closure-gate.yml — same deterministic projection used by PR-A overlay.
          src = Path('.github/workflows/daily-renderer-closure-gate.yml')
          text = src.read_text(encoding='utf-8')
          anchor = '      - "contracts/viewer_surface_*.json"\n'
          extras = [
              '      - "contracts/chatgpt_daily_authoring_v2.schema.json"\n',
              '      - "contracts/editorial_semantic_acceptance.schema.json"\n',
              '      - "contracts/chatgpt_semantic_freeze.schema.json"\n',
              '      - "contracts/canon_manifest.schema.json"\n',
              '      - "scripts/materialize_causal_research.py"\n',
              '      - "scripts/validate_editorial_semantic_boundary.py"\n',
              '      - "scripts/chatgpt_semantic_freeze.py"\n',
              '      - "scripts/canon_manifest.py"\n',
              '      - "scripts/build_research_input_manifest.py"\n',
              '      - "scripts/editorial_memory_retrieval.py"\n',
              '      - "scripts/temporal_evidence.py"\n',
              '      - "scripts/story-engine/materialize_story_engine.py"\n',
              '      - "scripts/story-engine/project_story_script_to_production.py"\n',
              '      - "scripts/story-engine/validate_story_engine_bundle.py"\n',
              '      - "scripts/story-engine/validate_story_engine_acceptance_v1_1.py"\n',
              '      - "scripts/run_daily_renderer_closure_v12.py"\n',
              '      - "scripts/run_semantic_frozen_renderer_closure_v12.py"\n',
              '      - "scripts/run_daily_production_v12.py"\n',
              '      - "skills/nasdaq-cafe-causal-research/contracts/**"\n',
              '      - "skills/nasdaq-cafe-causal-research/validators/**"\n',
              '      - "skills/nasdaq-cafe-editorial-memory/contracts/**"\n',
              '      - "skills/nasdaq-cafe-story-plan/contracts/**"\n',
              '      - "skills/nasdaq-cafe-story-plan/validators/**"\n',
              '      - "skills/nasdaq-cafe-story-authoring/contracts/**"\n',
              '      - "skills/nasdaq-cafe-story-authoring/validators/**"\n',
              '      - "skills/nasdaq-cafe-entertainment-critic/contracts/**"\n',
              '      - "skills/nasdaq-cafe-entertainment-critic/validators/**"\n',
              '      - "tests/editorial-semantic-boundary/**"\n',
          ]
          text = replace_once(text, anchor, anchor + ''.join(extras), 'daily gate semantic triggers')
          if text.count('jsonschema pytest pillow') != 1:
              raise SystemExit('daily gate dependency anchor mismatch')
          text = text.replace('jsonschema pytest pillow', 'jsonschema referencing pytest pillow', 1)
          old = '            tests/viewer-surface/test_viewer_surface_projection.py\n'
          new = (
              '            tests/viewer-surface/test_viewer_surface_projection.py \\\n'
              '            tests/editorial-semantic-boundary/test_current_contract_e2e.py \\\n'
              '            tests/editorial-semantic-boundary/test_boundary_architecture.py\n'
          )
          text = replace_once(text, old, new, 'daily gate semantic tests')
          old = '            scripts/visual_director_bridge.py\n'
          new = (
              '            scripts/visual_director_bridge.py \\\n'
              '            scripts/materialize_causal_research.py \\\n'
              '            scripts/validate_editorial_semantic_boundary.py \\\n'
              '            scripts/chatgpt_semantic_freeze.py \\\n'
              '            scripts/story-engine/materialize_story_engine.py \\\n'
              '            scripts/story-engine/project_story_script_to_production.py \\\n'
              '            scripts/run_daily_renderer_closure_v12.py \\\n'
              '            scripts/run_semantic_frozen_renderer_closure_v12.py \\\n'
              '            scripts/run_daily_production_v12.py\n'
          )
          text = replace_once(text, old, new, 'daily gate semantic py_compile')
          (out / 'daily-renderer-closure-gate.yml').write_text(text, encoding='utf-8')

          # chatgpt-daily-preview-production.yml — verify semantic dependencies/acceptance before Renderer work.
          src = Path('.github/workflows/chatgpt-daily-preview-production.yml')
          text = src.read_text(encoding='utf-8')
          setup = (
              '      - uses: actions/setup-python@v5\n'
              '        with:\n'
              '          python-version: "3.12"\n'
              '\n'
          )
          text = replace_once(text, setup, '', 'preview move Python setup')
          freeze = '      - name: Verify committed ChatGPT semantic freeze\n'
          semantic_setup = setup + (
              '      - name: Install semantic verification dependencies\n'
              '        shell: bash\n'
              '        run: python -m pip install --disable-pip-version-check jsonschema referencing\n'
              '\n'
          )
          text = replace_once(text, freeze, semantic_setup + freeze, 'preview semantic verifier dependencies')
          renderer = '      - name: Resolve canonical Renderer binding\n'
          acceptance = (
              '      - name: Verify current Editorial Semantic Acceptance\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          test "$(python3 -c \'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["contractVersion"])\')" = "1.2.0"\n'
              '          ACCEPTANCE_PATH="$(python3 -c \'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["editorialSemanticAcceptance"]["path"])\')"\n'
              '          python3 scripts/validate_editorial_semantic_boundary.py --repo-root . --date "$EPISODE_DATE" --verify "$ACCEPTANCE_PATH"\n'
              '\n'
          )
          text = replace_once(text, renderer, acceptance + renderer, 'preview acceptance verify')
          (out / 'chatgpt-daily-preview-production.yml').write_text(text, encoding='utf-8')
          PY

          grep -q '^      - "contracts/editorial_semantic_acceptance.schema.json"$' .pr-a-generated/daily-renderer-closure-gate.yml
          grep -q 'tests/editorial-semantic-boundary/test_current_contract_e2e.py' .pr-a-generated/daily-renderer-closure-gate.yml
          grep -q 'Verify current Editorial Semantic Acceptance' .pr-a-generated/chatgpt-daily-preview-production.yml
          git diff --check -- .pr-a-generated

      - name: Push generated workflow blobs as ordinary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .pr-a-generated/daily-renderer-closure-gate.yml .pr-a-generated/chatgpt-daily-preview-production.yml
          git commit -m 'PR-A: correct verified workflow projections'
          git push origin HEAD:hardening/editorial-semantic-boundary-v1-3
