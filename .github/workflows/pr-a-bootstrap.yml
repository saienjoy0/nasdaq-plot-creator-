name: PR-A Workflow Projection Bootstrap

on:
  push:
    branches:
      - hardening/editorial-semantic-boundary-v1-3
    paths:
      - '.github/workflows/pr-a-bootstrap.yml'

permissions:
  contents: write

jobs:
  project-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the two already-tested workflow projections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor; found={text.count(old)}')
              return text.replace(old, new, 1)

          out = Path('.pr-a-generated')
          out.mkdir(exist_ok=True)

          src = Path('.github/workflows/daily-renderer-closure-gate.yml')
          text = src.read_text(encoding='utf-8')
          anchor = '      - "contracts/viewer_surface_*.json"\n'
          addition = anchor + '''      - "contracts/chatgpt_daily_authoring_v2.schema.json"
          - "contracts/editorial_semantic_acceptance.schema.json"
          - "contracts/chatgpt_semantic_freeze.schema.json"
          - "contracts/canon_manifest.schema.json"
          - "scripts/materialize_causal_research.py"
          - "scripts/validate_editorial_semantic_boundary.py"
          - "scripts/chatgpt_semantic_freeze.py"
          - "scripts/canon_manifest.py"
          - "scripts/build_research_input_manifest.py"
          - "scripts/editorial_memory_retrieval.py"
          - "scripts/temporal_evidence.py"
          - "scripts/story-engine/materialize_story_engine.py"
          - "scripts/story-engine/project_story_script_to_production.py"
          - "scripts/story-engine/validate_story_engine_bundle.py"
          - "scripts/story-engine/validate_story_engine_acceptance_v1_1.py"
          - "scripts/run_daily_renderer_closure_v12.py"
          - "scripts/run_semantic_frozen_renderer_closure_v12.py"
          - "scripts/run_daily_production_v12.py"
          - "skills/nasdaq-cafe-causal-research/contracts/**"
          - "skills/nasdaq-cafe-causal-research/validators/**"
          - "skills/nasdaq-cafe-editorial-memory/contracts/**"
          - "skills/nasdaq-cafe-story-plan/contracts/**"
          - "skills/nasdaq-cafe-story-plan/validators/**"
          - "skills/nasdaq-cafe-story-authoring/contracts/**"
          - "skills/nasdaq-cafe-story-authoring/validators/**"
          - "skills/nasdaq-cafe-entertainment-critic/contracts/**"
          - "skills/nasdaq-cafe-entertainment-critic/validators/**"
          - "tests/editorial-semantic-boundary/**"
          '''
          # Strip bootstrap indentation from the embedded YAML rows.
          addition = addition.replace('          - ', '      - ')
          text = replace_once(text, anchor, addition, 'daily gate semantic triggers')
          text = text.replace('jsonschema pytest pillow', 'jsonschema referencing pytest pillow', 1)
          text = replace_once(
              text,
              '            tests/viewer-surface/test_viewer_surface_projection.py\n',
              '            tests/viewer-surface/test_viewer_surface_projection.py \\\n            tests/editorial-semantic-boundary/test_current_contract_e2e.py \\\n            tests/editorial-semantic-boundary/test_boundary_architecture.py\n',
              'daily gate semantic tests',
          )
          text = replace_once(
              text,
              '            scripts/visual_director_bridge.py\n',
              '            scripts/visual_director_bridge.py \\\n            scripts/materialize_causal_research.py \\\n            scripts/validate_editorial_semantic_boundary.py \\\n            scripts/chatgpt_semantic_freeze.py \\\n            scripts/story-engine/materialize_story_engine.py \\\n            scripts/story-engine/project_story_script_to_production.py \\\n            scripts/run_daily_renderer_closure_v12.py \\\n            scripts/run_semantic_frozen_renderer_closure_v12.py \\\n            scripts/run_daily_production_v12.py\n',
              'daily gate semantic py_compile',
          )
          (out / 'daily-renderer-closure-gate.yml').write_text(text, encoding='utf-8')

          src = Path('.github/workflows/chatgpt-daily-preview-production.yml')
          text = src.read_text(encoding='utf-8')
          setup = '''      - uses: actions/setup-python@v5
          with:
            python-version: "3.12"

          '''.replace('          with:', '        with:').replace('            python-version', '          python-version').replace('          ', '      ', 1)
          # Use the exact existing setup block to avoid YAML reformatting.
          setup = '      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n'
          text = replace_once(text, setup, '', 'preview move Python setup')
          freeze = '      - name: Verify committed ChatGPT semantic freeze\n'
          semantic_setup = setup + '''      - name: Install semantic verification dependencies
              shell: bash
              run: python -m pip install --disable-pip-version-check jsonschema referencing

          '''
          semantic_setup = semantic_setup.replace('              shell:', '        shell:').replace('              run:', '        run:').replace('          ', '      ', 1)
          text = replace_once(text, freeze, semantic_setup + freeze, 'preview semantic dependencies')
          renderer = '      - name: Resolve canonical Renderer binding\n'
          acceptance = '''      - name: Verify current Editorial Semantic Acceptance
              shell: bash
              run: |
                set -euo pipefail
                test "$(python3 -c 'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["contractVersion"])')" = "1.2.0"
                ACCEPTANCE_PATH="$(python3 -c 'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["editorialSemanticAcceptance"]["path"])')"
                python3 scripts/validate_editorial_semantic_boundary.py --repo-root . --date "$EPISODE_DATE" --verify "$ACCEPTANCE_PATH"

          '''
          acceptance = acceptance.replace('              shell:', '        shell:').replace('              run:', '        run:').replace('                ', '          ').replace('          ', '      ', 1)
          text = replace_once(text, renderer, acceptance + renderer, 'preview acceptance verify')
          (out / 'chatgpt-daily-preview-production.yml').write_text(text, encoding='utf-8')
          PY

          grep -q 'tests/editorial-semantic-boundary/test_current_contract_e2e.py' .pr-a-generated/daily-renderer-closure-gate.yml
          grep -q 'Verify current Editorial Semantic Acceptance' .pr-a-generated/chatgpt-daily-preview-production.yml
          git diff --check -- .pr-a-generated

      - name: Push generated workflow blobs as ordinary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .pr-a-generated/daily-renderer-closure-gate.yml .pr-a-generated/chatgpt-daily-preview-production.yml
          git commit -m 'PR-A: stage verified workflow projections'
          git push origin HEAD:hardening/editorial-semantic-boundary-v1-3
