name: Financial Recipe Compiler

on:
  pull_request:
    paths:
      - "contracts/financial_recipe_registry.json"
      - "contracts/financial_recipe_plan.schema.json"
      - "scripts/financial_recipe_compiler.py"
      - "tests/financial-recipe-compiler/**"
      - "designs/FINANCIAL_RECIPE_COMPILER.md"
      - ".github/workflows/financial-recipe-compiler.yml"
      - "contracts/final_episode_contract.schema.json"
      - "contracts/financial_visual_candidate_plan.schema.json"
      - "scripts/final_episode_contract.py"
  push:
    branches: [main]
    paths:
      - "contracts/financial_recipe_registry.json"
      - "contracts/financial_recipe_plan.schema.json"
      - "scripts/financial_recipe_compiler.py"
      - "tests/financial-recipe-compiler/**"
      - "designs/FINANCIAL_RECIPE_COMPILER.md"
      - ".github/workflows/financial-recipe-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile Python
        run: |
          python -m py_compile \
            scripts/final_episode_contract.py \
            scripts/financial_recipe_compiler.py \
            tests/final-episode-contract/generate_fixtures.py \
            tests/financial-recipe-compiler/test_financial_recipe_compiler.py
      - name: Parse JSON contracts
        run: |
          python -m json.tool contracts/financial_recipe_registry.json >/dev/null
          python -m json.tool contracts/financial_recipe_plan.schema.json >/dev/null
      - name: Generate Final Episode fixture
        run: python tests/final-episode-contract/generate_fixtures.py
      - name: Run compiler tests
        run: python -m unittest discover -s tests/financial-recipe-compiler -p 'test_*.py' -v
      - name: Compile representative Recipe Plan twice
        run: |
          python scripts/financial_recipe_compiler.py compile \
            tests/final-episode-contract/fixtures/final_episode_contract.valid.json \
            --repo-root . --output /tmp/recipe-plan-1.json
          python scripts/financial_recipe_compiler.py compile \
            tests/final-episode-contract/fixtures/final_episode_contract.valid.json \
            --repo-root . --output /tmp/recipe-plan-2.json
          cmp /tmp/recipe-plan-1.json /tmp/recipe-plan-2.json
