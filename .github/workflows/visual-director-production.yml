name: Visual Director Production Integration

on:
  pull_request:
    paths:
      - "contracts/renderer_binding.json"
      - "contracts/visual_intelligence_package.schema.json"
      - "scripts/renderer_binding.py"
      - "scripts/visual_director_bridge.py"
      - "scripts/validate_visual_intelligence_package.py"
      - "scripts/finalize_renderer_package_compat.py"
      - "scripts/build_final_production_package_hardened.py"
      - "scripts/build_renderer_handoff_240.py"
      - "scripts/run_daily_production.py"
      - "tests/remotion-compat/test_visual_director_bridge.py"
      - "tests/remotion-compat/test_visual_intelligence_convergence.py"
      - "tests/remotion-compat/test_visual_director_handoff.py"
      - "tests/remotion-compat/run_visual_director_cross_repo.py"
      - ".github/workflows/visual-director-production.yml"
  push:
    branches: [main]
    paths:
      - "contracts/renderer_binding.json"
      - "scripts/renderer_binding.py"
      - "scripts/visual_director_bridge.py"
      - "scripts/validate_visual_intelligence_package.py"
      - "scripts/build_renderer_handoff_240.py"
      - "tests/remotion-compat/**visual*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve canonical Renderer binding
        run: python scripts/renderer_binding.py --repo-root . --github-env "$GITHUB_ENV"
      - name: Checkout pinned Remotion Visual Director
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json
      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest jsonschema
          npm ci --prefix .renderer
      - name: Compile integration modules
        run: |
          python -m py_compile \
            scripts/renderer_binding.py \
            scripts/visual_director_bridge.py \
            scripts/validate_visual_intelligence_package.py \
            scripts/finalize_renderer_package_compat.py \
            scripts/build_final_production_package_hardened.py \
            scripts/build_renderer_handoff_240.py \
            tests/remotion-compat/run_visual_director_cross_repo.py
      - name: Run Plot Visual Intelligence unit and lineage tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q \
            tests/remotion-compat/test_visual_director_bridge.py \
            tests/remotion-compat/test_visual_intelligence_convergence.py \
            tests/remotion-compat/test_visual_director_handoff.py
      - name: Run pinned current-synthetic cross-repository acceptance
        run: |
          python tests/remotion-compat/run_visual_director_cross_repo.py \
            --repo-root . \
            --renderer-root .renderer
