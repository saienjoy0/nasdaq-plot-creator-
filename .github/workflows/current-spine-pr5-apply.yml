name: Current Spine PR-5 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/apply_pr5.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr5' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic PR-5 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/apply_pr5.py
          python3 -m py_compile \
            scripts/current_compatibility_adapter_v12.py \
            scripts/build_final_production_package_structured_v12.py \
            scripts/build_final_production_package_v12.py \
            scripts/materialize_chatgpt_daily_authoring.py \
            scripts/materialize_daily_episode.py
          rm -f .current-spine/apply_pr5.py .github/workflows/current-spine-pr5-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-5: use structured current machine authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
