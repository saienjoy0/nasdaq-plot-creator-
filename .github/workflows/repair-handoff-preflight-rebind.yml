name: Repair Handoff Preflight Rebind

on:
  pull_request:
    paths:
      - ".github/workflows/repair-handoff-preflight-rebind.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply minimal handoff-state repair
        run: |
          python - <<'PY'
          from pathlib import Path

          daily_path = Path('scripts/run_daily_production.py')
          daily = daily_path.read_text(encoding='utf-8')

          helper_anchor = '''def validate_date_in_name(date: str, path: Path, label: str) -> None:
'''
          helper = '''def reconcile_expected_handoff_preflight_mutation(*, workspace: Path, date: str) -> None:
    """Rebind the one preflight SHA intentionally extended by handoff hardening."""
    workspace = workspace.resolve()
    st_path = state_path(workspace, date)
    if not st_path.is_file():
        return
    state = load_json(st_path, "production state")
    if state.get("current_state") != "production_package_valid":
        return
    preflight_path = workspace / f"verification/{date}/official_execution_preflight.json"
    if not preflight_path.is_file():
        return
    relative = preflight_path.relative_to(workspace).as_posix()
    matches: list[dict[str, Any]] = []
    for transition in state.get("transitions", []):
        for evidence in transition.get("evidence", []):
            if evidence.get("path") == relative:
                matches.append(evidence)
    if len(matches) != 1:
        raise DailyProductionError(
            ERROR_CODES["stale"],
            f"expected exactly one bound preflight evidence record, found {len(matches)}",
        )
    evidence = matches[0]
    actual_sha = sha256_file(preflight_path)
    declared_sha = evidence.get("sha256")
    if declared_sha == actual_sha:
        return
    preflight = load_json(preflight_path, "handoff-updated preflight")
    hardening = preflight.get("episode_memory_hardening")
    required = {
        "pre_build": "pass",
        "public_artifacts": "pass",
        "handoff_recheck": "pass",
    }
    if not isinstance(hardening, dict) or any(
        hardening.get(key) != expected for key, expected in required.items()
    ):
        raise DailyProductionError(
            ERROR_CODES["stale"],
            "preflight changed without complete handoff hardening evidence",
        )
    evidence["sha256"] = actual_sha
    state.setdefault("evidence_rebindings", []).append({
        "path": relative,
        "previous_sha256": declared_sha,
        "sha256": actual_sha,
        "reason": "handoff_recheck_persisted",
    })
    write_atomic(st_path, state)


'''
          if 'def reconcile_expected_handoff_preflight_mutation' not in daily:
              if helper_anchor not in daily:
                  raise SystemExit('daily helper anchor not found')
              daily = daily.replace(helper_anchor, helper + helper_anchor, 1)

          start_old = '''def build_handoff(*, workspace: Path, date: str, bundle_root: Path, plot_commit: str) -> dict[str, Any]:
    current = status(workspace=workspace, date=date)
'''
          start_new = '''def build_handoff(*, workspace: Path, date: str, bundle_root: Path, plot_commit: str) -> dict[str, Any]:
    reconcile_expected_handoff_preflight_mutation(workspace=workspace, date=date)
    current = status(workspace=workspace, date=date)
'''
          if start_old in daily:
              daily = daily.replace(start_old, start_new, 1)
          elif start_new not in daily:
              raise SystemExit('build_handoff start anchor not found')

          end_old = '''    except Exception as exc:
        raise DailyProductionError(ERROR_CODES["handoff"], str(exc)) from exc
    add_transition(
        workspace=workspace, date=date, new_state="handoff_ready",
'''
          end_new = '''    except Exception as exc:
        raise DailyProductionError(ERROR_CODES["handoff"], str(exc)) from exc
    reconcile_expected_handoff_preflight_mutation(workspace=workspace, date=date)
    add_transition(
        workspace=workspace, date=date, new_state="handoff_ready",
'''
          if end_old in daily:
              daily = daily.replace(end_old, end_new, 1)
          elif end_new not in daily:
              raise SystemExit('build_handoff end anchor not found')
          daily_path.write_text(daily, encoding='utf-8')

          hardened_path = Path('scripts/build_renderer_handoff_hardened.py')
          hardened = hardened_path.read_text(encoding='utf-8')
          verify_old = '''    if not isinstance(value, dict) or value.get("episode_memory_hardening") != HANDOFF_HARDENING:
        raise HardenedHandoffError(
            "bundled preflight lost complete episode-memory hardening evidence"
        )
'''
          verify_new = '''    hardening = value.get("episode_memory_hardening") if isinstance(value, dict) else None
    if not isinstance(hardening, dict) or any(
        hardening.get(key) != expected for key, expected in HANDOFF_HARDENING.items()
    ):
        raise HardenedHandoffError(
            "bundled preflight lost complete episode-memory hardening evidence"
        )
'''
          if verify_old in hardened:
              hardened = hardened.replace(verify_old, verify_new, 1)
          elif verify_new not in hardened:
              raise SystemExit('bundled preflight verification anchor not found')
          hardened_path.write_text(hardened, encoding='utf-8')

          test_path = Path('tests/daily-production/test_daily_production.py')
          tests = test_path.read_text(encoding='utf-8')
          test_marker = '  def test_36_handoff_rebinds_expected_preflight_mutation(self):\n'
          test_block = '''  def test_36_handoff_rebinds_expected_preflight_mutation(self):
    self.h.advance_to("production_package_valid")
    preflight=self.h.evidence(
      f"verification/{DATE}/official_execution_preflight.json",
      {"episode_memory_hardening":{"pre_build":"pass","public_artifacts":"pass","preflight_persisted":"pass"}},
    )
    state=json.loads(daily.state_path(self.h.root,DATE).read_text())
    state["transitions"][-1]["evidence"].append({
      "path":preflight.relative_to(self.h.root).as_posix(),
      "sha256":daily.sha256_file(preflight),
    })
    daily.write_atomic(daily.state_path(self.h.root,DATE),state)
    manifest=self.h.evidence("bundle/handoff_manifest.json")
    original=daily.handoff_builder.build_handoff
    def fake(**kw):
      value=json.loads(preflight.read_text())
      hardening=dict(value["episode_memory_hardening"])
      hardening.update({"pre_build":"pass","public_artifacts":"pass","handoff_recheck":"pass"})
      value["episode_memory_hardening"]=hardening
      preflight.write_text(json.dumps(value))
      return {"status":"created","manifest_path":str(manifest)}
    daily.handoff_builder.build_handoff=fake
    try:
      result=daily.build_handoff(
        workspace=self.h.root,date=DATE,bundle_root=self.h.root/"bundles",plot_commit="a"*40,
      )
      self.assertEqual("created",result["status"])
      self.assertEqual("handoff_ready",daily.status(workspace=self.h.root,date=DATE)["current_state"])
      state=json.loads(daily.state_path(self.h.root,DATE).read_text())
      self.assertEqual("handoff_recheck_persisted",state["evidence_rebindings"][-1]["reason"])
      self.assertEqual(daily.sha256_file(preflight),state["evidence_rebindings"][-1]["sha256"])
    finally:
      daily.handoff_builder.build_handoff=original

'''
          if test_marker not in tests:
              end_marker = '\nif __name__=="__main__":unittest.main()\n'
              if end_marker not in tests:
                  raise SystemExit('daily test end marker not found')
              tests = tests.replace(end_marker, '\n' + test_block + end_marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run focused regression tests
        run: |
          python tests/daily-production/test_daily_production.py
          python -m py_compile scripts/run_daily_production.py scripts/build_renderer_handoff_hardened.py

      - name: Commit repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/repair-handoff-preflight-rebind.yml
          git add -- \
            scripts/run_daily_production.py \
            scripts/build_renderer_handoff_hardened.py \
            tests/daily-production/test_daily_production.py
          git diff --cached --check
          git commit -m "Rebind handoff-updated preflight evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
