name: FVU R3 Sync Shared Fixture

on:
  pull_request:
    paths:
      - ".github/workflows/fvu-r3-sync-shared-fixture.yml"
      - "scripts/verify_shared_financial_fixture.py"
      - ".github/workflows/shared-financial-fixture.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/fvu-r3-shared-fixture-mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download exact renderer fixture
        run: |
          set -euo pipefail
          target="shared-fixtures/financial-visual-2.3"
          base="https://raw.githubusercontent.com/saienjoy0/saienjoy0-nasdaq-cafe-remotion/main/shared-fixtures/financial-visual-2.3"
          mkdir -p "$target"
          curl -fsSL "$base/render_spec.json" -o "$target/render_spec.json"
          curl -fsSL "$base/fixture_manifest.json" -o "$target/fixture_manifest.json"
          python3 scripts/verify_shared_financial_fixture.py
      - name: Commit exact mirrored bytes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add shared-fixtures/financial-visual-2.3/render_spec.json shared-fixtures/financial-visual-2.3/fixture_manifest.json
          if git diff --cached --quiet; then
            echo "Shared fixture already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror shared financial handoff fixture"
          git push origin "HEAD:${HEAD_REF}"
