name: Visual Source Contract

on:
  pull_request:
    paths:
      - "contracts/final_episode_contract.schema.json"
      - "scripts/visual_source_contract.py"
      - "scripts/resolve_visual_sources.py"
      - "scripts/select_visual_sources.py"
      - "scripts/visual_source_projection.py"
      - "scripts/visual_evidence_coverage.py"
      - "scripts/materialize_daily_episode.py"
      - "tests/visual-source/**"
      - ".github/workflows/visual-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema pillow pytest
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Compile Visual Source implementation
        run: |
          python -m py_compile \
            scripts/visual_source_contract.py \
            scripts/resolve_visual_sources.py \
            scripts/select_visual_sources.py \
            scripts/visual_evidence_coverage.py \
            scripts/visual_source_projection.py \
            scripts/materialize_daily_episode.py
      - name: Run Visual Source tests
        run: python -m pytest -q tests/visual-source
