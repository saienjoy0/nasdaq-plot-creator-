name: Temporary Semantic Reseal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-reseal-semantic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/current-preview-readiness-gate
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema referencing
      - name: Issue fresh Editorial Semantic Acceptance
        run: python3 scripts/validate_editorial_semantic_boundary.py --date 2026-08-17 --repo-root . --authoring daily-authoring/2026-08-17.json
      - name: Create fresh Semantic Freeze v1.2
        run: python3 scripts/chatgpt_semantic_freeze.py --repo-root . create --date 2026-08-17
      - name: Verify new Semantic Freeze
        run: python3 scripts/chatgpt_semantic_freeze.py --repo-root . verify --date 2026-08-17 --manifest semantic-freezes/2026-08-17.json
      - name: Commit exact deterministic receipts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/2026-08-17/editorial-semantic-preflight verification/2026-08-17/editorial_semantic_acceptance.json semantic-freezes/2026-08-17.json
          if git diff --cached --quiet; then
            echo 'semantic chain already matches'
          else
            git commit -m 'build: reseal accepted 2026-08-17 semantic chain [skip ci]'
            git push origin HEAD:fix/current-preview-readiness-gate
          fi
