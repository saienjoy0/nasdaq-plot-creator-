name: tmp-fix-v2-review-production-approval

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-v2-review-production-approval
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Project accepted 04 review into legacy compatibility approval
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/materialize_chatgpt_daily_authoring.py')
          text=path.read_text(encoding='utf-8')
          old='''        "verdict": "approved" if review["verdict"] == "pass" else review["verdict"],\n        "scores": copy.deepcopy(review["scores"]),\n'''
          new='''        "verdict": "approved" if review["verdict"] == "pass" else review["verdict"],\n        "approvedForCodex": review["verdict"] == "pass",\n        "scores": copy.deepcopy(review["scores"]),\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif '"approvedForCodex": review["verdict"] == "pass"' not in text:
              raise SystemExit('v2 review approval patch anchor missing')
          PY

      - name: Add focused regression
        shell: bash
        run: |
          cat > tests/test_current_v2_review_production_approval.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / 'scripts' / 'materialize_chatgpt_daily_authoring.py'


          def _derived_review_ast() -> ast.Dict:
              tree = ast.parse(SOURCE.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == 'derived_review'
                      for target in node.targets
                  ):
                      assert isinstance(node.value, ast.Dict)
                      return node.value
              raise AssertionError('derived_review assignment not found')


          def test_current_v2_review_projects_pass_into_legacy_approval_flag() -> None:
              value = _derived_review_ast()
              mapping = {
                  key.value: item
                  for key, item in zip(value.keys, value.values, strict=True)
                  if isinstance(key, ast.Constant) and isinstance(key.value, str)
              }
              assert 'approvedForCodex' in mapping
              expr = mapping['approvedForCodex']
              assert isinstance(expr, ast.Compare)
              assert isinstance(expr.left, ast.Subscript)
              assert isinstance(expr.ops[0], ast.Eq)
              assert isinstance(expr.comparators[0], ast.Constant)
              assert expr.comparators[0].value == 'pass'
          PY

      - name: Run regression
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m py_compile scripts/materialize_chatgpt_daily_authoring.py
          python3 -m pytest -q tests/test_current_v2_review_production_approval.py

      - name: Commit implementation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_chatgpt_daily_authoring.py tests/test_current_v2_review_production_approval.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
            exit 0
          fi
          git commit -m "Project current-v2 review approval for production"
          git push origin HEAD:fix/current-v2-review-production-approval
