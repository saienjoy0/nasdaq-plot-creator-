name: Daily Renderer Closure Gate

on:
  pull_request:
    paths:
      - "daily-authoring-parts/**"
      - "daily-authoring/**"
      - "daily-inputs/**"
      - "working/**"
      - "research/**"
      - "episodes/**"
      - "render-specs/**"
      - "daily-assets/**"
      - "contracts/financial_*.json"
      - "contracts/visual_grammar_*.json"
      - "contracts/viewer_surface_*.json"
      - "contracts/chatgpt_daily_authoring_v2.schema.json"
      - "contracts/editorial_semantic_acceptance.schema.json"
      - "contracts/chatgpt_semantic_freeze.schema.json"
      - "contracts/canon_manifest.schema.json"
      - "scripts/materialize_causal_research.py"
      - "scripts/validate_editorial_semantic_boundary.py"
      - "scripts/chatgpt_semantic_freeze.py"
      - "scripts/canon_manifest.py"
      - "scripts/build_research_input_manifest.py"
      - "scripts/editorial_memory_retrieval.py"
      - "scripts/temporal_evidence.py"
      - "scripts/story-engine/materialize_story_engine.py"
      - "scripts/story-engine/project_story_script_to_production.py"
      - "scripts/story-engine/validate_story_engine_bundle.py"
      - "scripts/story-engine/validate_story_engine_acceptance_v1_1.py"
      - "scripts/run_daily_renderer_closure_v12.py"
      - "scripts/run_semantic_frozen_renderer_closure_v12.py"
      - "scripts/run_daily_production_v12.py"
      - "skills/nasdaq-cafe-causal-research/contracts/**"
      - "skills/nasdaq-cafe-causal-research/validators/**"
      - "skills/nasdaq-cafe-editorial-memory/contracts/**"
      - "skills/nasdaq-cafe-story-plan/contracts/**"
      - "skills/nasdaq-cafe-story-plan/validators/**"
      - "skills/nasdaq-cafe-story-authoring/contracts/**"
      - "skills/nasdaq-cafe-story-authoring/validators/**"
      - "skills/nasdaq-cafe-entertainment-critic/contracts/**"
      - "skills/nasdaq-cafe-entertainment-critic/validators/**"
      - "tests/editorial-semantic-boundary/**"
      - "scripts/assemble_chatgpt_daily_authoring_parts.py"
      - "scripts/materialize_chatgpt_daily_authoring.py"
      - "scripts/viewer_surface_projection.py"
      - "scripts/fixup_chatgpt_daily_materialization.py"
      - "scripts/validate_chatgpt_daily_authoring_closure.py"
      - "scripts/run_daily_renderer_closure.py"
      - "scripts/materialize_daily_episode.py"
      - "scripts/materialize_renderer_sources.py"
      - "scripts/materialize_financial_contract_1_0.py"
      - "scripts/finalize_renderer_package*.py"
      - "scripts/remotion_*.py"
      - "scripts/visual_director_bridge.py"
      - "scripts/run_daily_production_hardened.py"
      - "tests/remotion-compat/**"
      - "tests/viewer-surface/**"
      - ".github/workflows/daily-renderer-closure-gate.yml"
  workflow_dispatch:
    inputs:
      episode_date:
        description: "YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDERER_COMMIT: fc1aa384011549e93bd0698e0bb4790c58dfa153
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact episode date
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EPISODE_DATE="${{ inputs.episode_date }}"
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
            EPISODE_DATE="$(python - <<'PY'
          import re
          from pathlib import Path

          dates = set()
          patterns = (
              r"^daily-authoring-parts/(\d{4}-\d{2}-\d{2})/",
              r"^daily-authoring/(\d{4}-\d{2}-\d{2})\.json$",
              r"^daily-inputs/(\d{4}-\d{2}-\d{2})/",
              r"^working/(\d{4}-\d{2}-\d{2})/",
              r"^research/(\d{4}-\d{2}-\d{2})/",
              r"^episodes/(\d{4}-\d{2}-\d{2})/",
              r"^render-specs/(\d{4}-\d{2}-\d{2})/",
              r"^daily-assets/(\d{4}-\d{2}-\d{2})/",
          )
          for line in Path('/tmp/changed-files.txt').read_text(encoding='utf-8').splitlines():
              for pattern in patterns:
                  match = re.match(pattern, line)
                  if match:
                      dates.add(match.group(1))
          if len(dates) > 1:
              raise SystemExit('closure PR must target exactly one episode date: ' + ','.join(sorted(dates)))
          if dates:
              print(next(iter(dates)))
          PY
          )"
          fi

          if [[ -n "$EPISODE_DATE" ]]; then
            [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            echo "EPISODE_DATE=$EPISODE_DATE" >> "$GITHUB_ENV"
            CURRENT_V2_OWNED="$(EPISODE_DATE="$EPISODE_DATE" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          date = os.environ['EPISODE_DATE']
          authoring_path = Path('daily-authoring') / f'{date}.json'
          freeze_path = Path('semantic-freezes') / f'{date}.json'
          acceptance_path = Path('verification') / date / 'editorial_semantic_acceptance.json'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if authoring_path.is_file():
              authoring = load(authoring_path)
              if authoring.get('contractVersion') != '2.0.0' or authoring.get('episodeDate') != date:
                  raise SystemExit(f'invalid current-v2 authoring marker: {authoring_path}')
              missing = [str(path) for path in (freeze_path, acceptance_path) if not path.is_file()]
              if missing:
                  raise SystemExit('current-v2 authoring requires committed Acceptance + Freeze: ' + ','.join(missing))
              freeze = load(freeze_path)
              acceptance = load(acceptance_path)
              if freeze.get('contractVersion') != '1.2.0' or freeze.get('episodeDate') != date:
                  raise SystemExit(f'invalid current-v2 Semantic Freeze: {freeze_path}')
              if acceptance.get('contractVersion') != '1.0.0' or acceptance.get('episodeDate') != date or acceptance.get('status') != 'PASS':
                  raise SystemExit(f'invalid current-v2 Editorial Semantic Acceptance: {acceptance_path}')
              authoring_ref = freeze.get('canonicalAuthoring', {})
              acceptance_ref = freeze.get('editorialSemanticAcceptance', {})
              if authoring_ref.get('path') != authoring_path.as_posix() or authoring_ref.get('sha256') != sha256(authoring_path):
                  raise SystemExit('Semantic Freeze does not bind current Canonical Authoring bytes')
              if acceptance_ref.get('path') != acceptance_path.as_posix() or acceptance_ref.get('sha256') != sha256(acceptance_path):
                  raise SystemExit('Semantic Freeze does not bind current Editorial Semantic Acceptance bytes')
              accepted_authoring = acceptance.get('authoring', {})
              if accepted_authoring.get('path') != authoring_path.as_posix() or accepted_authoring.get('sha256') != sha256(authoring_path):
                  raise SystemExit('Editorial Semantic Acceptance does not bind current Canonical Authoring bytes')
              print('true')
              raise SystemExit(0)

          decision_path = Path('working') / date / 'visual-intelligence' / 'visual_intelligence_decision.json'
          if not decision_path.is_file():
              print('false')
              raise SystemExit(0)
          value = load(decision_path)
          print('true' if (
              value.get('contractVersion') == '1.0.0'
              and value.get('bridgeContractVersion') == 'visual-intelligence-bridge/1.2.0'
              and value.get('episodeDate') == date
          ) else 'false')
          PY
          )"
            if [[ "$CURRENT_V2_OWNED" == "true" ]]; then
              echo "RUN_EXACT_DAY=false" >> "$GITHUB_ENV"
              echo "Legacy exact-day closure skipped: $EPISODE_DATE is owned by the current-v2 semantic/Visual Intelligence path. Regression tests still run."
            else
              echo "RUN_EXACT_DAY=true" >> "$GITHUB_ENV"
              echo "Legacy Renderer closure target: $EPISODE_DATE"
            fi
          else
            echo "RUN_EXACT_DAY=false" >> "$GITHUB_ENV"
            echo "No daily episode artifact changed; running closure regressions only."
          fi

      - name: Checkout exact Preview renderer
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install closure dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema referencing pytest pillow
          npm --prefix .renderer ci

      - name: Run closure regression tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q \
            tests/remotion-compat/test_chatgpt_daily_authoring_closure.py \
            tests/remotion-compat/test_fox_expression_projection.py \
            tests/remotion-compat/test_visual_director_bridge.py \
            tests/remotion-compat/test_remotion_template_variant.py \
            tests/viewer-surface/test_viewer_surface_projection.py \
            tests/editorial-semantic-boundary/test_current_contract_e2e.py \
            tests/editorial-semantic-boundary/test_boundary_architecture.py
          python -m py_compile \
            scripts/validate_chatgpt_daily_authoring_closure.py \
            scripts/run_daily_renderer_closure.py \
            scripts/assemble_chatgpt_daily_authoring_parts.py \
            scripts/materialize_chatgpt_daily_authoring.py \
            scripts/viewer_surface_projection.py \
            scripts/materialize_renderer_sources.py \
            scripts/fixup_chatgpt_daily_materialization.py \
            scripts/remotion_template_variant.py \
            scripts/visual_director_bridge.py \
            scripts/materialize_causal_research.py \
            scripts/validate_editorial_semantic_boundary.py \
            scripts/chatgpt_semantic_freeze.py \
            scripts/story-engine/materialize_story_engine.py \
            scripts/story-engine/project_story_script_to_production.py \
            scripts/run_daily_renderer_closure_v12.py \
            scripts/run_semantic_frozen_renderer_closure_v12.py \
            scripts/run_daily_production_v12.py

      - name: Require exact-day Renderer 2.4 closure
        if: env.RUN_EXACT_DAY == 'true'
        run: |
          python scripts/run_daily_renderer_closure.py \
            --date "$EPISODE_DATE" \
            --repo-root . \
            --renderer-root .renderer

      - name: Upload closure evidence
        if: always() && env.RUN_EXACT_DAY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-renderer-closure-${{ env.EPISODE_DATE }}
          path: |
            verification/${{ env.EPISODE_DATE }}/
            working/${{ env.EPISODE_DATE }}/visual_capability_hints.json
            working/${{ env.EPISODE_DATE }}/visual_candidate_catalog.json
            working/${{ env.EPISODE_DATE }}/visual_direction_plan.json
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
          if-no-files-found: warn
          retention-days: 7
