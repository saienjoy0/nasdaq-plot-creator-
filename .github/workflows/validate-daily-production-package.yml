name: Validate Daily Production Package

on:
  pull_request:
    paths:
      - "daily-payloads/**"
      - ".github/workflows/validate-daily-production-package.yml"
  workflow_dispatch:
    inputs:
      episode_date:
        description: "YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EPISODE_DATE: ${{ inputs.episode_date || '2026-08-06' }}
      RENDERER_COMMIT: 750f993bd00cf2f67fdb4ab18907e82ed0dc68df
      RENDERER_CONTRACT_VERSION: 2.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cross-repository collector artifact access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collector-artifact"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/saienjoy0/nasdaq-cafe-news-collector/actions/artifacts/8955731244/zip \
            > "$RUNNER_TEMP/collector-artifact/source.zip"
          test -s "$RUNNER_TEMP/collector-artifact/source.zip"
          unzip -l "$RUNNER_TEMP/collector-artifact/source.zip"
      - name: Reconstruct immutable daily payload
        run: |
          python - <<'PY'
          import base64, binascii, hashlib, json, zlib
          from pathlib import Path
          date = "${{ env.EPISODE_DATE }}"
          root = Path.cwd()
          parts = sorted((root / "daily-payloads" / date).glob("part-*.txt"))
          if not parts:
              raise SystemExit(f"No payload parts for {date}")
          payload = json.loads("".join(p.read_text(encoding="utf-8") for p in parts))
          if payload["episode_date"] != date:
              raise SystemExit("Payload date mismatch")
          for relative, record in payload["files"].items():
              encoded = record["data"]
              try:
                  compressed = base64.b64decode(encoded, validate=True)
              except binascii.Error as exc:
                  raise SystemExit(
                      f"Payload base64 invalid: {relative}; length={len(encoded)}; mod4={len(encoded) % 4}; {exc}"
                  ) from exc
              raw = zlib.decompress(compressed)
              if hashlib.sha256(raw).hexdigest() != record["sha256"]:
                  raise SystemExit(f"Payload SHA mismatch: {relative}")
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          PY
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Materialize lineage-bound episode package
        run: python scripts/materialize_daily_episode.py --date "$EPISODE_DATE" --repo-root .
      - name: Initialize deterministic daily state
        run: |
          python scripts/run_daily_production_hardened.py --workspace . init \
            --episode-date "$EPISODE_DATE" \
            --daily-source-package "daily-inputs/$EPISODE_DATE/daily_source_package_$EPISODE_DATE.md" \
            --requested-scope preview \
            --renderer-commit "$RENDERER_COMMIT" \
            --renderer-contract-version "$RENDERER_CONTRACT_VERSION"
      - name: Advance validated editorial stages
        run: |
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state research_inputs_bound --evidence "research/$EPISODE_DATE/research_input_manifest.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state causal_dossier_valid --evidence "research/$EPISODE_DATE/causal_research_dossier_$EPISODE_DATE.json" "research/$EPISODE_DATE/causal_dossier_validation.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state episode_package_final --evidence "episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state memory_usage_valid --evidence "research/$EPISODE_DATE/causal_dossier_validation.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state assets_resolved --evidence "verification/$EPISODE_DATE/asset_resolution_log.json" "verification/$EPISODE_DATE/image_generation_log.json"
      - name: Build and validate production package
        run: |
          python scripts/run_daily_production_hardened.py --workspace . build-production \
            --episode-date "$EPISODE_DATE" \
            --episode-package "episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
          python scripts/run_daily_production_hardened.py --workspace . status --episode-date "$EPISODE_DATE"
      - name: Build immutable preview handoff
        run: |
          python scripts/run_daily_production_hardened.py --workspace . build-handoff \
            --episode-date "$EPISODE_DATE" \
            --bundle-root production-bundles \
            --plot-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload validated production package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-production-${{ env.EPISODE_DATE }}
          path: |
            working/${{ env.EPISODE_DATE }}/
            research/${{ env.EPISODE_DATE }}/
            episodes/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
            verification/${{ env.EPISODE_DATE }}/
            production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: warn
          retention-days: 14
