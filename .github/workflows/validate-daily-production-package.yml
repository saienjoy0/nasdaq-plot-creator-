name: Validate Daily Production Package

on:
  pull_request:
    paths:
      - "daily-production-requests/**"
      - "daily-authoring-parts/**"
      - "daily-authoring/**"
      - "daily-inputs/**"
      - "working/**"
      - "research/**"
      - "episodes/**"
      - "render-specs/**"
      - "daily-assets/**"
      - "semantic-freezes/**"
      - "verification/**"
      - "production-bundles/**"
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "skills/**"
      - "AGENTS.md"
  workflow_dispatch:
    inputs:
      episode_date:
        description: "YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact validation episode date
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_PREVIEW_REQUEST_PATH=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EPISODE_DATE="${{ inputs.episode_date }}"
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
            EPISODE_DATE="$(python - <<'PY'
          import re
          from pathlib import Path

          dates = set()
          patterns = (
              r"^daily-production-requests/(\d{4}-\d{2}-\d{2})[^/]*\.json$",
              r"^daily-authoring-parts/(\d{4}-\d{2}-\d{2})/",
              r"^daily-authoring/(\d{4}-\d{2}-\d{2})\.json$",
              r"^daily-inputs/(\d{4}-\d{2}-\d{2})/",
              r"^working/(\d{4}-\d{2}-\d{2})/",
              r"^research/(\d{4}-\d{2}-\d{2})/",
              r"^episodes/(\d{4}-\d{2}-\d{2})/",
              r"^render-specs/(\d{4}-\d{2}-\d{2})/",
              r"^daily-assets/(\d{4}-\d{2}-\d{2})/",
          )
          for line in Path('/tmp/changed-files.txt').read_text(encoding='utf-8').splitlines():
              for pattern in patterns:
                  match = re.match(pattern, line)
                  if match:
                      dates.add(match.group(1))
          if len(dates) > 1:
              raise SystemExit('validation PR must target exactly one episode date: ' + ','.join(sorted(dates)))
          if dates:
              print(next(iter(dates)))
          PY
          )"
            mapfile -t PREVIEW_REQUESTS < <(grep -E '^daily-production-requests/[0-9]{4}-[0-9]{2}-[0-9]{2}[^/]*\.json$' /tmp/changed-files.txt || true)
            if [[ "${#PREVIEW_REQUESTS[@]}" -gt 1 ]]; then
              echo "::error::validation PR may change at most one formal PREVIEW request"
              printf 'changed=%s\n' "${PREVIEW_REQUESTS[*]}"
              exit 1
            fi
            if [[ "${#PREVIEW_REQUESTS[@]}" -eq 1 ]]; then
              CURRENT_PREVIEW_REQUEST_PATH="${PREVIEW_REQUESTS[0]}"
            fi
          fi

          if [[ -n "$EPISODE_DATE" ]]; then
            [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            echo "EPISODE_DATE=$EPISODE_DATE" >> "$GITHUB_ENV"
            CURRENT_V2_OWNED="$(EPISODE_DATE="$EPISODE_DATE" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          date = os.environ['EPISODE_DATE']
          authoring_path = Path('daily-authoring') / f'{date}.json'
          freeze_path = Path('semantic-freezes') / f'{date}.json'
          acceptance_path = Path('verification') / date / 'editorial_semantic_acceptance.json'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if authoring_path.is_file():
              authoring = load(authoring_path)
              if authoring.get('contractVersion') != '2.0.0' or authoring.get('episodeDate') != date:
                  raise SystemExit(f'invalid current-v2 authoring marker: {authoring_path}')
              missing = [str(path) for path in (freeze_path, acceptance_path) if not path.is_file()]
              if missing:
                  raise SystemExit('current-v2 authoring requires committed Acceptance + Freeze: ' + ','.join(missing))
              freeze = load(freeze_path)
              acceptance = load(acceptance_path)
              if freeze.get('contractVersion') != '1.2.0' or freeze.get('episodeDate') != date:
                  raise SystemExit(f'invalid current-v2 Semantic Freeze: {freeze_path}')
              if acceptance.get('contractVersion') != '1.0.0' or acceptance.get('episodeDate') != date or acceptance.get('status') != 'PASS':
                  raise SystemExit(f'invalid current-v2 Editorial Semantic Acceptance: {acceptance_path}')
              authoring_ref = freeze.get('canonicalAuthoring', {})
              acceptance_ref = freeze.get('editorialSemanticAcceptance', {})
              if authoring_ref.get('path') != authoring_path.as_posix() or authoring_ref.get('sha256') != sha256(authoring_path):
                  raise SystemExit('Semantic Freeze does not bind current Canonical Authoring bytes')
              if acceptance_ref.get('path') != acceptance_path.as_posix() or acceptance_ref.get('sha256') != sha256(acceptance_path):
                  raise SystemExit('Semantic Freeze does not bind current Editorial Semantic Acceptance bytes')
              accepted_authoring = acceptance.get('authoring', {})
              if accepted_authoring.get('path') != authoring_path.as_posix() or accepted_authoring.get('sha256') != sha256(authoring_path):
                  raise SystemExit('Editorial Semantic Acceptance does not bind current Canonical Authoring bytes')
              print('true')
              raise SystemExit(0)

          decision_path = Path('working') / date / 'visual-intelligence' / 'visual_intelligence_decision.json'
          if not decision_path.is_file():
              print('false')
              raise SystemExit(0)
          value = load(decision_path)
          print('true' if (
              value.get('contractVersion') == '1.0.0'
              and value.get('bridgeContractVersion') == 'visual-intelligence-bridge/1.2.0'
              and value.get('episodeDate') == date
          ) else 'false')
          PY
          )"
            if [[ "$CURRENT_V2_OWNED" == "true" ]]; then
              echo "RUN_EXACT_DAY=false" >> "$GITHUB_ENV"
              echo "Legacy exact-day package build skipped: $EPISODE_DATE is owned by the current-v2 semantic/Visual Intelligence path. Regression checks still run."
              if [[ -n "$CURRENT_PREVIEW_REQUEST_PATH" ]]; then
                echo "RUN_CURRENT_PREVIEW_READINESS=true" >> "$GITHUB_ENV"
                echo "CURRENT_PREVIEW_REQUEST_PATH=$CURRENT_PREVIEW_REQUEST_PATH" >> "$GITHUB_ENV"
              else
                echo "RUN_CURRENT_PREVIEW_READINESS=false" >> "$GITHUB_ENV"
              fi
            else
              echo "RUN_EXACT_DAY=true" >> "$GITHUB_ENV"
              echo "RUN_CURRENT_PREVIEW_READINESS=false" >> "$GITHUB_ENV"
              echo "Legacy package validation target: $EPISODE_DATE"
            fi
          else
            echo "RUN_EXACT_DAY=false" >> "$GITHUB_ENV"
            echo "RUN_CURRENT_PREVIEW_READINESS=false" >> "$GITHUB_ENV"
            echo "No daily episode artifact changed; running current contract/regression checks only."
          fi

      - name: Resolve canonical Renderer binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          value = json.loads(Path('contracts/renderer_binding.json').read_text(encoding='utf-8'))
          renderer = value['renderer']
          print('RENDERER_REPOSITORY=' + renderer['repository'])
          print('RENDERER_COMMIT=' + renderer['commit'])
          print('RENDERER_CONTRACT_VERSION=' + renderer['contractVersion'])
          PY

      - name: Checkout pinned Remotion renderer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RENDERER_REPOSITORY }}
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema pytest pillow
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm --prefix .renderer ci

      - name: Run compatibility and hardening regressions
        env:
          PYTHONPATH: scripts
        run: |
          python tests/remotion-compat/test_remotion_compat.py
          python tests/daily-production-hardening/test_daily_production_hardening.py
          python tests/current-spine/test_required_merge_gate.py
          python -m pytest -q \
            tests/story-engine-integration \
            tests/visual-source-baseline \
            tests/visual-source \
            tests/remotion-compat/test_chatgpt_daily_authoring_closure.py \
            tests/remotion-compat/test_fox_expression_projection.py \
            tests/remotion-compat/test_visual_director_bridge.py \
            tests/remotion-compat/test_remotion_template_variant.py \
            tests/viewer-surface/test_viewer_surface_projection.py

      - name: Run Current Preview semantic readiness
        if: env.RUN_CURRENT_PREVIEW_READINESS == 'true'
        shell: bash
        run: |
          set +e
          python scripts/current_preview_request_readiness_v12.py \
            --workspace . \
            --renderer-root .renderer \
            --request "$CURRENT_PREVIEW_REQUEST_PATH"
          code=$?
          echo "CURRENT_PREVIEW_READINESS_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload Current Preview readiness evidence
        if: always() && env.RUN_CURRENT_PREVIEW_READINESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-preview-readiness-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: |
            working/${{ env.EPISODE_DATE }}/visual-intelligence/
            verification/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Enforce Current Preview semantic readiness
        if: env.RUN_CURRENT_PREVIEW_READINESS == 'true'
        shell: bash
        run: |
          code="${CURRENT_PREVIEW_READINESS_EXIT_CODE:-2}"
          if [[ "$code" -ne 0 ]]; then
            echo "::error::Current PREVIEW request is not compile-ready; inspect readiness artifact for requiredAction"
            exit "$code"
          fi

      - name: Run exact-day Renderer 2.4 production closure
        if: env.RUN_EXACT_DAY == 'true'
        run: |
          python scripts/run_daily_renderer_closure.py \
            --date "$EPISODE_DATE" \
            --repo-root . \
            --renderer-root .renderer

      - name: Build immutable preview handoff
        if: env.RUN_EXACT_DAY == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_production_hardened.py --workspace . build-handoff \
            --episode-date "$EPISODE_DATE" \
            --bundle-root production-bundles \
            --plot-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee "verification/$EPISODE_DATE/build-handoff.log"

      - name: Upload immutable renderer handoff
        if: success() && env.RUN_EXACT_DAY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-handoff-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload validation outputs
        if: always() && (env.RUN_EXACT_DAY == 'true' || env.RUN_CURRENT_PREVIEW_READINESS == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-production-${{ env.EPISODE_DATE }}
          path: |
            working/${{ env.EPISODE_DATE }}/
            research/${{ env.EPISODE_DATE }}/
            episodes/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
            verification/${{ env.EPISODE_DATE }}/
            production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: warn
          retention-days: 14
