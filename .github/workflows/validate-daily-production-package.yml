name: Validate Daily Production Package

on:
  pull_request:
    paths:
      - "daily-authoring-parts/**"
      - "daily-authoring/**"
      - "daily-inputs/**"
      - "working/**"
      - "research/**"
      - "episodes/**"
      - "render-specs/**"
      - "daily-assets/**"
      - "contracts/**"
      - "scripts/assemble_chatgpt_daily_authoring_parts.py"
      - "scripts/materialize_chatgpt_daily_authoring.py"
      - "scripts/viewer_surface_projection.py"
      - "scripts/fixup_chatgpt_daily_materialization.py"
      - "scripts/validate_chatgpt_daily_authoring_closure.py"
      - "scripts/run_daily_renderer_closure.py"
      - "scripts/materialize_daily_episode.py"
      - "scripts/materialize_renderer_sources.py"
      - "scripts/materialize_financial_contract_1_0.py"
      - "scripts/finalize_renderer_package*.py"
      - "scripts/remotion_*.py"
      - "scripts/renderer_binding.py"
      - "scripts/visual_director_bridge.py"
      - "scripts/validate_visual_intelligence_package.py"
      - "scripts/run_daily_production_hardened.py"
      - "scripts/story-engine/**"
      - "tests/daily-production-hardening/**"
      - "tests/story-engine-integration/**"
      - "tests/remotion-compat/**"
      - "tests/viewer-surface/**"
      - "tests/visual-source-baseline/**"
      - "tests/visual-source/**"
      - ".github/workflows/validate-daily-production-package.yml"
  workflow_dispatch:
    inputs:
      episode_date:
        description: "YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical Renderer binding
        id: renderer_binding
        shell: bash
        run: |
          set -euo pipefail
          python scripts/renderer_binding.py \
            --repo-root . \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve validation mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EPISODE_DATE="${{ inputs.episode_date }}"
            RUN_REAL_DAY=true
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
            RESULT="$(python - <<'PY'
          import re
          from pathlib import Path

          dates = set()
          patterns = (
              r"^daily-authoring-parts/(\d{4}-\d{2}-\d{2})/",
              r"^daily-authoring/(\d{4}-\d{2}-\d{2})\.json$",
              r"^daily-inputs/(\d{4}-\d{2}-\d{2})/",
              r"^working/(\d{4}-\d{2}-\d{2})/",
              r"^research/(\d{4}-\d{2}-\d{2})/",
              r"^episodes/(\d{4}-\d{2}-\d{2})/",
              r"^render-specs/(\d{4}-\d{2}-\d{2})/",
              r"^daily-assets/(\d{4}-\d{2}-\d{2})/",
          )
          for line in Path('/tmp/changed-files.txt').read_text(encoding='utf-8').splitlines():
              for pattern in patterns:
                  match = re.match(pattern, line)
                  if match:
                      dates.add(match.group(1))
          if len(dates) > 1:
              raise SystemExit('validation PR must target at most one episode date: ' + ','.join(sorted(dates)))
          print(next(iter(dates)) if dates else 'NONE')
          PY
          )"
            if [[ "$RESULT" == "NONE" ]]; then
              EPISODE_DATE=""
              RUN_REAL_DAY=false
            else
              EPISODE_DATE="$RESULT"
              RUN_REAL_DAY=true
            fi
          fi
          if [[ "$RUN_REAL_DAY" == "true" ]]; then
            [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            echo "EPISODE_DATE=$EPISODE_DATE" >> "$GITHUB_ENV"
          fi
          echo "RUN_REAL_DAY=$RUN_REAL_DAY" >> "$GITHUB_ENV"
          echo "Package validation real-day=$RUN_REAL_DAY date=${EPISODE_DATE:-synthetic-current}"

      - name: Checkout pinned Remotion renderer
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.renderer_binding.outputs.renderer_repository }}
          ref: ${{ steps.renderer_binding.outputs.renderer_commit }}
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema pytest pillow
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm --prefix .renderer ci

      - name: Run current-contract compatibility and hardening regressions
        env:
          PYTHONPATH: scripts
        run: |
          python tests/remotion-compat/test_remotion_compat.py
          python tests/daily-production-hardening/test_daily_production_hardening.py
          python -m pytest -q \
            tests/story-engine-integration \
            tests/visual-source-baseline \
            tests/visual-source \
            tests/remotion-compat/test_chatgpt_daily_authoring_closure.py \
            tests/remotion-compat/test_fox_expression_projection.py \
            tests/remotion-compat/test_visual_director_bridge.py \
            tests/remotion-compat/test_visual_intelligence_convergence.py \
            tests/remotion-compat/test_remotion_template_variant.py \
            tests/viewer-surface/test_viewer_surface_projection.py
          npm --prefix .renderer run test:visual-director

      - name: Run exact-day Renderer 2.4 production closure
        if: env.RUN_REAL_DAY == 'true'
        run: |
          python scripts/run_daily_renderer_closure.py \
            --date "$EPISODE_DATE" \
            --repo-root . \
            --renderer-root .renderer

      - name: Build immutable preview handoff
        if: env.RUN_REAL_DAY == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_production_hardened.py --workspace . build-handoff \
            --episode-date "$EPISODE_DATE" \
            --bundle-root production-bundles \
            --plot-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            2>&1 | tee "verification/$EPISODE_DATE/build-handoff.log"

      - name: Upload immutable renderer handoff
        if: success() && env.RUN_REAL_DAY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-handoff-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload validation outputs
        if: always() && env.RUN_REAL_DAY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-production-${{ env.EPISODE_DATE }}
          path: |
            working/${{ env.EPISODE_DATE }}/
            research/${{ env.EPISODE_DATE }}/
            episodes/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
            verification/${{ env.EPISODE_DATE }}/
            production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: warn
          retention-days: 14
