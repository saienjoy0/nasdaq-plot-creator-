name: Temporary Restore Authoring Closure

on:
  push:
    branches:
      - fix/current-preview-readiness-gate

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-preview-readiness-gate
          fetch-depth: 0
      - name: Restore known-good closure and apply one-line ownership change
        shell: bash
        run: |
          set -euo pipefail
          git show d267b65b874b263782d091a8e6be7e76f73614e5:scripts/validate_chatgpt_daily_authoring_closure.py > scripts/validate_chatgpt_daily_authoring_closure.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_chatgpt_daily_authoring_closure.py')
          text = path.read_text(encoding='utf-8')
          old = 'remotion_template_variant.validate_authored_variant(\n'
          new = 'remotion_template_variant.validate_pre_visual_intelligence_variant(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one strict closure call, found={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temporary-restore-authoring-closure.yml
          git diff --check
          git diff d267b65b874b263782d091a8e6be7e76f73614e5 -- scripts/validate_chatgpt_daily_authoring_closure.py
      - name: Commit exact repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_chatgpt_daily_authoring_closure.py .github/workflows/temporary-restore-authoring-closure.yml
          git commit -m 'Restore authoring closure compatibility surface'
          git push origin HEAD:fix/current-preview-readiness-gate
