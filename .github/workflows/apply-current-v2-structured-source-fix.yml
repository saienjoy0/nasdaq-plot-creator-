name: Apply current-v2 structured source fix

on:
  push:
    branches:
      - fix/current-preview-readiness-gate
    paths:
      - .github/workflows/apply-current-v2-structured-source-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-preview-readiness-gate
          fetch-depth: 0
      - name: Apply exact owning-layer patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/materialize_daily_episode.py")
          text = path.read_text(encoding="utf-8")
          old = '''    production_annex = {
              "contract_version":"1.0.0", "episode_date":date,
              "post_inquisition":{"status":"pass","required_changes_applied":True,"unresolved_required_changes":0},
              "image_resolution":image_resolution,
              "renderer_contract":{"repository":"saienjoy0/saienjoy0-nasdaq-cafe-remotion","schema_version":render["schemaVersion"]},
              "asset_catalog":asset_catalog, "render_spec":render,
          }
          public = normalize_scene_headings(contract_package.read_text(encoding="utf-8").rstrip())
          '''
          new = '''    production_annex = {
              "contract_version":"1.0.0", "episode_date":date,
              "post_inquisition":{"status":"pass","required_changes_applied":True,"unresolved_required_changes":0},
              "image_resolution":image_resolution,
              "renderer_contract":{"repository":"saienjoy0/saienjoy0-nasdaq-cafe-remotion","schema_version":render["schemaVersion"]},
              "asset_catalog":asset_catalog, "render_spec":render,
          }
          structured_source = work / "current_final_production_source.json"
          structured_source.write_text(dump(production_annex) + "\\n", encoding="utf-8")
          public = normalize_scene_headings(contract_package.read_text(encoding="utf-8").rstrip())
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one current-v2 production annex block; found={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/apply-current-v2-structured-source-fix.yml")
          workflow.unlink()
      - name: Verify exact diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/materialize_daily_episode.py
          test ! -e .github/workflows/apply-current-v2-structured-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/materialize_daily_episode.py .github/workflows/apply-current-v2-structured-source-fix.yml
          git commit -m "Persist current-v2 structured production source"
          git push origin HEAD:fix/current-preview-readiness-gate
