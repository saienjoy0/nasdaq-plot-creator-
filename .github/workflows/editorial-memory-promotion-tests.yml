name: Editorial Memory Promotion Tests

on:
  pull_request:
    paths:
      - "scripts/plan_memory_promotion.py"
      - "scripts/apply_memory_promotion.py"
      - "scripts/memory_promotion_*.py"
      - "scripts/promote_episode_memory.py"
      - "skills/nasdaq-cafe-editorial-memory/contracts/**"
      - "tests/memory-promotion/**"
      - "skills/nasdaq-cafe-editorial-memory/validators/validate_memory_contracts.py"
      - ".github/workflows/editorial-memory-promotion-tests.yml"
  push:
    branches:
      - "test/pr2-real-episode-acceptance"
    paths:
      - "scripts/plan_memory_promotion.py"
      - "scripts/apply_memory_promotion.py"
      - "scripts/memory_promotion_*.py"
      - "scripts/promote_episode_memory.py"
      - "skills/nasdaq-cafe-editorial-memory/contracts/**"
      - "tests/memory-promotion/**"
      - "skills/nasdaq-cafe-editorial-memory/validators/validate_memory_contracts.py"
      - ".github/workflows/editorial-memory-promotion-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile promotion scripts
        run: |
          python -m py_compile \
            scripts/memory_promotion_common.py \
            scripts/memory_promotion_preflight.py \
            scripts/memory_promotion_conflicts.py \
            scripts/memory_promotion_merge.py \
            scripts/memory_promotion_planner.py \
            scripts/memory_promotion_apply.py \
            scripts/memory_promotion_lib.py \
            scripts/plan_memory_promotion.py \
            scripts/apply_memory_promotion.py \
            scripts/promote_episode_memory.py \
            skills/nasdaq-cafe-editorial-memory/validators/validate_memory_contracts.py

      - name: Validate JSON schema syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/nasdaq-cafe-editorial-memory/contracts").glob("*.schema.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("PASS", path)
          PY

      - name: Validate editorial memory contracts
        run: python skills/nasdaq-cafe-editorial-memory/validators/validate_memory_contracts.py --require-jsonschema

      - name: Run safe-promotion tests
        run: python -m unittest discover -s tests/memory-promotion -p 'test_*.py' -v

      - name: Run real episode acceptance test
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="cfdb50259b0d4413ba208d0de02a3f07d34af2a1"
          SOURCE_BASE="https://raw.githubusercontent.com/saienjoy0/saienjoy0-nasdaq-cafe-remotion/${SOURCE_COMMIT}"
          ACCEPTANCE_DIR="working/real-episode-acceptance/2026-07-31"
          RUN1="working/memory-promotion/acceptance-2026-07-31"
          RUN2="working/memory-promotion/acceptance-2026-07-31-noop"

          rm -rf "$ACCEPTANCE_DIR" "$RUN1" "$RUN2"
          mkdir -p "$ACCEPTANCE_DIR"

          curl --fail --location --silent --show-error \
            "$SOURCE_BASE/episode-packages/2026-07-31/episode_package_2026-07-31.md" \
            --output "$ACCEPTANCE_DIR/episode_package_2026-07-31.md"
          curl --fail --location --silent --show-error \
            "$SOURCE_BASE/render-specs/2026-07-31/render_spec.json" \
            --output "$ACCEPTANCE_DIR/render_spec.json"
          curl --fail --location --silent --show-error \
            "$SOURCE_BASE/render-specs/2026-07-31/production_ready.json" \
            --output "$ACCEPTANCE_DIR/validator_report.json"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("working/real-episode-acceptance/2026-07-31")
          ready = json.loads((root / "validator_report.json").read_text(encoding="utf-8"))
          record = {
              "contract_version": "1.0.0",
              "episode_date": "2026-07-31",
              "title": "Amazon急騰でも半導体は横ばい　NASDAQが見たAI投資の答え",
              "main_story": "Amazon決算でAWS売上が市場予想を上回り、AI投資の回収証拠として評価されたこと",
              "story_spine": "AmazonではAWSの予想超過がAI投資の回収証拠として株価を押し上げ、NASDAQ全体では大型クラウド株の上昇が金利上昇とApple安を上回った一方、半導体への波及は限定的だった。",
              "central_hypothesis": {
                  "text": "昨夜の市場はAI設備投資の金額より、クラウド売上として回収が確認できるかを評価した。",
                  "confidence": "medium",
              },
              "contrary_evidence": [
                  "米10年債利回りは約4.75%へ上昇",
                  "Appleは7.35%下落",
                  "SOXXは0.07%高、AMDは1.90%安で半導体全面高ではない",
                  "市場セッション日付のメタデータと記事本文に一日のずれがある",
              ],
              "watch_next": [
                  "他のクラウド企業でもAI投資と売上成長が同時に続くか",
                  "米10年債利回りが4.7%台でさらに上昇するか",
                  "半導体が大型クラウド株の上昇へ追いつくか",
              ],
              "topics": ["AI設備投資", "クラウド", "NASDAQ"],
              "entities": ["Amazon", "AWS", "Apple", "SOXX"],
              "thread_updates": [
                  {
                      "thread_id": "ai-capex-payback",
                      "title": "AI設備投資の回収",
                      "question": "AI設備投資は売上としてどの程度回収されているか",
                      "summary": "AWSの予想超過は、AI設備投資を支出額ではなく回収証拠で評価する材料になった。一方、半導体への波及は限定的だった。",
                      "triggers": ["AI設備投資", "クラウド売上", "AWS"],
                      "entities": ["Amazon", "AWS"],
                      "topics": ["AI設備投資", "クラウド"],
                      "claim_ids": ["ai-capex-evaluation-axis"],
                      "status": "active",
                  }
              ],
              "claim_updates": [
                  {
                      "claim_id": "ai-capex-evaluation-axis",
                      "subject": "AI設備投資の評価軸",
                      "claim": "市場はAI設備投資の金額だけでなく、クラウド売上として回収が確認できるかを評価する。",
                      "status": "active",
                      "confidence": "medium",
                      "reason": "2026-07-31回ではAWS売上が市場予想を上回り、Amazonが上昇した一方、半導体への波及は限定的だったため。",
                      "evidence_paths": [
                          "working/real-episode-acceptance/2026-07-31/episode_package_2026-07-31.md",
                          "working/real-episode-acceptance/2026-07-31/render_spec.json"
                      ],
                      "thread_ids": ["ai-capex-payback"],
                      "entities": ["Amazon", "AWS"],
                      "topics": ["AI設備投資", "クラウド"],
                  }
              ],
              "alias_updates": [],
              "production_lessons": [],
              "source_paths": {
                  "episode_package": "working/real-episode-acceptance/2026-07-31/episode_package_2026-07-31.md",
                  "render_spec": "working/real-episode-acceptance/2026-07-31/render_spec.json",
                  "validator_report": "working/real-episode-acceptance/2026-07-31/validator_report.json",
              },
              "source_hashes": {
                  "episode_package": ready["episodePackageSha256"],
                  "render_spec": ready["renderSpecSha256"],
              },
              "approval": {
                  "status": "approved_preview",
                  "approved_at": ready["createdAt"],
              },
          }
          (root / "publication_record_2026-07-31.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --exit-code -- editorial-memory

          python scripts/plan_memory_promotion.py \
            "$ACCEPTANCE_DIR/publication_record_2026-07-31.json" \
            --output "$RUN1" | tee /tmp/acceptance-plan.log
          grep -F "SAFE_TO_APPLY true" /tmp/acceptance-plan.log
          grep -F "NOOP false" /tmp/acceptance-plan.log
          git diff --exit-code -- editorial-memory

          python - <<'PY'
          import json
          from pathlib import Path
          run = Path("working/memory-promotion/acceptance-2026-07-31")
          preflight = json.loads((run / "source_preflight.json").read_text())
          conflicts = json.loads((run / "conflict_report.json").read_text())
          plan = json.loads((run / "promotion_plan.json").read_text())
          assert preflight["status"] == "pass"
          assert preflight["checks"]["validator_report"] == "pass"
          assert preflight["checks"]["episode_date_consistency"] == "pass"
          assert conflicts["unresolved_count"] == 0
          assert conflicts["safe_to_apply"] is True
          assert plan["revision"] == "v001"
          assert plan["safe_to_apply"] is True
          assert plan["noop"] is False
          assert (run / "dry_run_report.md").is_file()
          staged = run / "staged/editorial-memory/episodes/2026-07-31/revisions/v001"
          for name in (
              "publication_record.json",
              "episode_package.md",
              "render_spec.json",
              "validator_report.json",
              "episode_summary.md",
              "provenance.json",
          ):
              assert (staged / name).is_file(), name
          PY

          python scripts/apply_memory_promotion.py \
            "$RUN1/promotion_plan.json" --apply --no-commit | tee /tmp/acceptance-apply.log
          grep -F "STATUS applied" /tmp/acceptance-apply.log
          grep -F "REVISION v001" /tmp/acceptance-apply.log

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("editorial-memory/episodes/2026-07-31")
          archive = root / "revisions/v001"
          index = json.loads((root / "index.json").read_text())
          provenance = json.loads((archive / "provenance.json").read_text())
          ready = json.loads(Path("working/real-episode-acceptance/2026-07-31/validator_report.json").read_text())
          assert index["current_revision"] == "v001"
          assert provenance["generated_memory_ids"]["threads"] == ["ai-capex-payback"]
          assert provenance["generated_memory_ids"]["claims"] == ["ai-capex-evaluation-axis"]
          assert provenance["source_artifacts"]["episode_package"]["sha256"] == ready["episodePackageSha256"]
          assert provenance["source_artifacts"]["render_spec"]["sha256"] == ready["renderSpecSha256"]
          assert hashlib.sha256((archive / "episode_package.md").read_bytes()).hexdigest() == ready["episodePackageSha256"]
          assert hashlib.sha256((archive / "render_spec.json").read_bytes()).hexdigest() == ready["renderSpecSha256"]
          PY

          python scripts/plan_memory_promotion.py \
            "$ACCEPTANCE_DIR/publication_record_2026-07-31.json" \
            --output "$RUN2" | tee /tmp/acceptance-noop-plan.log
          grep -F "SAFE_TO_APPLY true" /tmp/acceptance-noop-plan.log
          grep -F "NOOP true" /tmp/acceptance-noop-plan.log

          python scripts/apply_memory_promotion.py \
            "$RUN2/promotion_plan.json" --apply --no-commit | tee /tmp/acceptance-noop-apply.log
          grep -F "STATUS noop" /tmp/acceptance-noop-apply.log
