name: Bootstrap Visual Grammar VG-5 Cross Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/bootstrap_visual_grammar_vg5_cross_artifact.py"
      - ".github/workflows/bootstrap-visual-grammar-vg5-cross-artifact.yml"
      - "scripts/visual_grammar_cross_artifact.py"
      - "scripts/visual_grammar_report_recompute.py"
      - "tests/visual-grammar-cross-artifact/**"

permissions:
  contents: write

jobs:
  sync-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-grammar-vg5-cross-artifact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync renderer contracts and patch gate
        run: python scripts/bootstrap_visual_grammar_vg5_cross_artifact.py
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.0
      - name: Run semantic contract regression
        run: python -m unittest tests/test_visual_grammar_contract.py -v
      - name: Run cross-artifact tests
        run: python -m unittest discover -s tests/visual-grammar-cross-artifact -p "test_*.py" -v
      - name: Commit exact mirrors and integrated gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            contracts/visual_grammar_timing_report.schema.json \
            contracts/visual_grammar_renderer_compatibility.json \
            scripts/visual_grammar_cross_artifact.py
          git commit -m "VG-5: sync renderer contracts and integrate cross-artifact gate"
          git push origin HEAD:feat/visual-grammar-vg5-cross-artifact
