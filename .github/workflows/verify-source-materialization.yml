name: Verify editorial canon

on:
  pull_request:
    paths:
      - "source-of-truth/**"
      - "contracts/canon_manifest.schema.json"
      - "scripts/canon_manifest.py"
      - "scripts/materialize_sources.py"
      - "scripts/chatgpt_semantic_freeze.py"
      - "tests/canon-manifest/**"
      - ".github/workflows/verify-source-materialization.yml"
  push:
    branches: [main]
    paths:
      - "source-of-truth/**"
      - "contracts/canon_manifest.schema.json"
      - "scripts/canon_manifest.py"
      - "scripts/materialize_sources.py"
      - "scripts/chatgpt_semantic_freeze.py"
      - "tests/canon-manifest/**"
      - ".github/workflows/verify-source-materialization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Parse canon contracts
        run: |
          python -m json.tool source-of-truth/canon_manifest.json >/dev/null
          python -m json.tool contracts/canon_manifest.schema.json >/dev/null
      - name: Verify all 01-04 canon bytes before materialization
        run: python scripts/canon_manifest.py verify
      - name: Materialize packed 03-04 from the same manifest
        run: python scripts/materialize_sources.py
      - name: Verify source contract again
        run: python scripts/canon_manifest.py verify
      - name: Compile canon boundary
        run: python -m py_compile scripts/canon_manifest.py scripts/materialize_sources.py scripts/chatgpt_semantic_freeze.py
      - name: Canon manifest regression
        run: python -m unittest discover -s tests/canon-manifest -p 'test_*.py' -v
      - name: Confirm generated 03-04 are working-tree outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f source-of-truth/03_episode_production_spec.md
          test -f source-of-truth/04_entertainment_inquisitor.md
          test -n "$(git status --short source-of-truth/03_episode_production_spec.md source-of-truth/04_entertainment_inquisitor.md)"
          test ! -e source-of-truth/packed_sources.json
