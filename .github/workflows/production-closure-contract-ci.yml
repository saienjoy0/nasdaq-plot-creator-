name: Production Closure Contract CI

on:
  push:
    branches:
      - fix/production-closure-v1-2
    paths:
      - "scripts/materialize_chatgpt_daily_authoring.py"
      - "scripts/validate_chatgpt_daily_authoring_closure.py"
      - "scripts/visual_grammar_report_recompute.py"
      - "contracts/visual_grammar_timing_report.schema.json"
      - "tests/production-closure/**"
      - "tests/visual-grammar-cross-artifact/**"
      - "daily-authoring-parts/2026-08-12/**"
      - ".github/workflows/production-closure-contract-ci.yml"
  pull_request:
    paths:
      - "scripts/materialize_chatgpt_daily_authoring.py"
      - "scripts/validate_chatgpt_daily_authoring_closure.py"
      - "scripts/visual_grammar_report_recompute.py"
      - "contracts/visual_grammar_timing_report.schema.json"
      - "tests/production-closure/**"
      - "tests/visual-grammar-cross-artifact/**"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - run: python -m unittest discover -s tests/production-closure -v
      - run: python -m unittest discover -s tests/visual-grammar-cross-artifact -v
      - name: Assemble and validate 2026-08-12 authoring closure
        run: |
          python scripts/assemble_chatgpt_daily_authoring_parts.py --date 2026-08-12 --repo-root .
          python scripts/validate_chatgpt_daily_authoring_closure.py \
            --authoring daily-authoring/2026-08-12.json \
            --registry contracts/financial_recipe_registry.json
