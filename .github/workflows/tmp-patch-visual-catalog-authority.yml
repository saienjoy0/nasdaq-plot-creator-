name: Temporary Candidate Authority Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-patch-visual-catalog-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/current-preview-readiness-gate
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply reviewed single-function replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/visual_intelligence_pipeline_v12.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if not any(\n            candidate.get("capability") in required_modes\n            for candidate in by_beat.get(beat_id, [])\n        ):\n            raise VisualIntelligenceStageError(\n                f"E_VISUAL_REQUIRED_MODE_UNAVAILABLE:{beat_id}:required="\n                + ",".join(str(item) for item in required_modes)\n            )\n'''
          new = '''        if not any(\n            candidate.get("requirementsSatisfied") is True\n            for candidate in by_beat.get(beat_id, [])\n        ):\n            raise VisualIntelligenceStageError(\n                f"E_VISUAL_REQUIRED_MODE_UNAVAILABLE:{beat_id}:required="\n                + ",".join(str(item) for item in required_modes)\n            )\n'''
          if old not in text:
              raise SystemExit('reviewed old candidate-authority block not found exactly once')
          if text.count(old) != 1:
              raise SystemExit('reviewed old candidate-authority block is not unique')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run RED regression as GREEN
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/current-spine/test_visual_candidate_requirements_authority.py
      - name: Commit exact implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/visual_intelligence_pipeline_v12.py
          git commit -m 'fix: trust Renderer candidate requirements satisfaction [skip ci]'
          git push origin HEAD:fix/current-preview-readiness-gate
