name: Current Spine PR-2 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/apply_pr2.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic PR-2 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/apply_pr2.py
          python3 -m py_compile \
            scripts/visual_intelligence_artifacts_v12.py \
            scripts/visual_intelligence_pipeline_v12.py \
            scripts/materialize_visual_intelligence_artifact_v12.py \
            scripts/run_visual_intelligence_v12.py \
            scripts/validate_visual_intelligence_package.py \
            scripts/run_daily_renderer_closure_v12.py \
            scripts/run_semantic_frozen_renderer_closure_v12.py \
            scripts/renderer_contract_sync_v12.py \
            tests/remotion-compat/run_visual_intelligence_v12_cross_repo.py \
            tests/current-spine/test_current_spine_characterization.py
          rm -f .current-spine/apply_pr2.py .github/workflows/current-spine-pr2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-2: separate VI semantic payloads and canonical artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
