name: Current Spine PR-1 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/pr1.patch"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed PR-1 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .current-spine/pr1.patch
          git apply .current-spine/pr1.patch
          python3 -m py_compile scripts/run_daily_production_v12.py scripts/run_daily_renderer_closure_v12.py scripts/current_daily_mechanisms_v12.py
          rm -f .current-spine/pr1.patch .github/workflows/current-spine-pr1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-1: separate current policy and freeze request identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
