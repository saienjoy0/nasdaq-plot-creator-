name: Current Spine PR-1 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/apply_pr1.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic PR-1 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/apply_pr1.py
          python3 -m py_compile \
            scripts/run_daily_production_v12.py \
            scripts/run_daily_renderer_closure_v12.py \
            scripts/current_daily_mechanisms_v12.py \
            tests/remotion-compat/test_visual_intelligence_v12_state.py \
            tests/current-spine/test_current_spine_characterization.py
          rm -f \
            .current-spine/apply_pr1.py \
            .current-spine/pr1.patch \
            .github/workflows/current-spine-pr1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-1: separate current policy and freeze request identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
