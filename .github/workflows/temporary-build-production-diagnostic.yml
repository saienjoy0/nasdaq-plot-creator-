name: Temporary Build Production Diagnostic

on:
  push:
    branches:
      - fix/measured-visual-diversity-2026-08-10
    paths:
      - ".github/temporary-build-production-diagnostic.json"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATE: 2026-08-10
      SOURCE_RUN_ID: "31451704351"
      SOURCE_ARTIFACT: h4-clean-real-day-2026-08-10
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/measured-visual-diversity-2026-08-10
          persist-credentials: false
          clean: true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: .diagnostic-input
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Restore failed H4 state
        shell: bash
        run: |
          set -euo pipefail
          cp -a .diagnostic-input/. .

      - uses: actions/checkout@v6
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: 0aaaf77eb2fd54e3e1b5eb4db05410dcaf71b673
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install finalizer validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Re-run only build-production and capture exact failure
        id: build
        shell: bash
        run: |
          set +e
          python scripts/run_daily_production_hardened.py --workspace "$GITHUB_WORKSPACE" build-production \
            --episode-date "$DATE" \
            --episode-package "episodes/$DATE/episode_package_$DATE.md" \
            > /tmp/build-production.stdout 2> /tmp/build-production.stderr
          rc=$?
          set -e
          mkdir -p verification/$DATE
          {
            echo "exit_code=$rc"
            echo "--- stdout ---"
            tail -n 80 /tmp/build-production.stdout
            echo "--- stderr ---"
            tail -n 120 /tmp/build-production.stderr
          } | tee verification/$DATE/build_production_exact_failure.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish exact diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TITLE="TEMP BUILD PRODUCTION DIAGNOSTIC 2026-08-10"
          BODY="$(python3 - <<'PY'
          from pathlib import Path
          p=Path('verification/2026-08-10/build_production_exact_failure.txt')
          text=p.read_text(encoding='utf-8') if p.is_file() else 'diagnostic file missing'
          print('Temporary diagnostic; will be removed after repair.\n\n```text\n'+text[-12000:]+'\n```')
          PY
          )"
          n="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$n" ]]; then
            gh issue edit "$n" --body "$BODY"
            gh issue reopen "$n" >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          test "${{ steps.build.outputs.exit_code }}" -ne 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-production-exact-failure
          path: verification/2026-08-10/build_production_exact_failure.txt
          retention-days: 2
