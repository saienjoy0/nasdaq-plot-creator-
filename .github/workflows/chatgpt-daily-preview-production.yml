name: ChatGPT Daily Preview Production

on:
  push:
    branches: [main]
    paths:
      - "daily-production-requests/*.json"

permissions:
  contents: read

jobs:
  produce-preview-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RENDERER_COMMIT: 36440cbe84331d020d4fe808d5c2fcbcac20833c
      RENDERER_CONTRACT_VERSION: 2.4.0
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve requested episode date
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff --name-only HEAD^ HEAD | grep -E '^daily-production-requests/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | tail -n 1)"
          test -n "$REQUEST"
          EPISODE_DATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "$REQUEST")"
          CONFIRMATION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["confirmation"])' "$REQUEST")"
          test "$CONFIRMATION" = "PREVIEW"
          test -f "daily-authoring/$EPISODE_DATE.json"
          test -f "daily-inputs/$EPISODE_DATE/daily_source_package_$EPISODE_DATE.md"
          echo "EPISODE_DATE=$EPISODE_DATE" >> "$GITHUB_ENV"
          echo "REQUEST_PATH=$REQUEST" >> "$GITHUB_ENV"

      - name: Checkout pinned Remotion renderer
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check jsonschema pytest pillow
          npm --prefix .renderer ci

      - name: Expand approved ChatGPT authoring
        run: |
          python scripts/materialize_chatgpt_daily_authoring.py --date "$EPISODE_DATE" --repo-root .

      - name: Bind legacy materializer to requested date without editorial changes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          date = Path("$REQUEST_PATH").stem
          authoring = json.loads(Path(f"daily-authoring/{date}.json").read_text(encoding="utf-8"))
          dossier = Path(f"research/{date}/causal_research_dossier.template.json")
          dossier_sha = hashlib.sha256(dossier.read_bytes()).hexdigest()
          p = Path("scripts/materialize_daily_episode.py")
          text = p.read_text(encoding="utf-8")
          text, n1 = re.subn(r'DOSSIER_TEMPLATE_SHA = "[0-9a-f]{64}"', f'DOSSIER_TEMPLATE_SHA = "{dossier_sha}"', text, count=1)
          text, n2 = re.subn(r'"--market-date", "[0-9]{4}-[0-9]{2}-[0-9]{2}"', f'"--market-date", "{authoring["marketDate"]}"', text, count=1)
          text, n3 = re.subn(r'"--information-cutoff", "[^"]+"', f'"--information-cutoff", "{authoring["informationCutoff"]}"', text, count=1)
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"legacy materializer bind failed: {(n1,n2,n3)}")
          p.write_text(text, encoding="utf-8")
          print(f"bound materializer date={date} market={authoring['marketDate']} dossier={dossier_sha}")
          PY

      - name: Validate authored visual grammar before TTS
        run: |
          mkdir -p "verification/$EPISODE_DATE"
          python scripts/pre_tts_visual_gate.py \
            --render-spec "render-specs/$EPISODE_DATE/render_spec.json" \
            --story-bindings "working/$EPISODE_DATE/story-engine/story_production_bindings.json" \
            --output "verification/$EPISODE_DATE/pre_tts_visual_gate.json"

      - name: Prepare explicit visual sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_visual_sources.py --date "$EPISODE_DATE" --repo-root . \
            | tee "verification/$EPISODE_DATE/visual-source-prepare.log"

      - name: Materialize lineage-bound episode and financial contract
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/materialize_daily_episode.py --date "$EPISODE_DATE" --repo-root .
            python scripts/materialize_financial_contract_1_0.py --date "$EPISODE_DATE" --repo-root .
          } 2>&1 | tee "verification/$EPISODE_DATE/materializer.log"

      - name: Initialize deterministic daily state
        run: |
          python scripts/run_daily_production_hardened.py --workspace . init \
            --episode-date "$EPISODE_DATE" \
            --daily-source-package "daily-inputs/$EPISODE_DATE/daily_source_package_$EPISODE_DATE.md" \
            --requested-scope preview \
            --renderer-commit "$RENDERER_COMMIT" \
            --renderer-contract-version "$RENDERER_CONTRACT_VERSION"

      - name: Advance validated editorial stages
        run: |
          STORY="working/$EPISODE_DATE/story-engine"
          ACCEPT="$STORY/story_engine_acceptance.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state research_inputs_bound --evidence "research/$EPISODE_DATE/research_input_manifest.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state causal_dossier_valid --evidence "research/$EPISODE_DATE/causal_research_dossier_$EPISODE_DATE.json" "research/$EPISODE_DATE/causal_dossier_validation.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state episode_package_final --evidence "episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md" "$ACCEPT" "$STORY/story_projection_report.json" "verification/$EPISODE_DATE/pre_tts_visual_gate.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state memory_usage_valid --evidence "research/$EPISODE_DATE/causal_dossier_validation.json"
          python scripts/run_daily_production_hardened.py --workspace . advance --episode-date "$EPISODE_DATE" --state assets_resolved --evidence "verification/$EPISODE_DATE/asset_resolution_log.json" "verification/$EPISODE_DATE/image_generation_log.json"

      - name: Activate Remotion 2.4 compatibility tuple
        run: cp contracts/financial_visual_compatibility_2_4.json contracts/financial_visual_compatibility.json

      - name: Build and run official renderer validator
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/run_daily_production_hardened.py --workspace . build-production \
              --episode-date "$EPISODE_DATE" \
              --episode-package "episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
            python scripts/run_daily_production_hardened.py --workspace . status --episode-date "$EPISODE_DATE"
          } 2>&1 | tee "verification/$EPISODE_DATE/build-production.log"

      - name: Build immutable preview handoff
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_daily_production_hardened.py --workspace . build-handoff \
            --episode-date "$EPISODE_DATE" \
            --bundle-root production-bundles \
            --plot-commit "$GITHUB_SHA" \
            2>&1 | tee "verification/$EPISODE_DATE/build-handoff.log"

      - name: Record immutable baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="verification/$EPISODE_DATE/visual_source_baseline.json"
          python scripts/record_visual_source_baseline.py \
            --repo-root . \
            --episode-date "$EPISODE_DATE" \
            --plot-commit "$GITHUB_SHA" \
            --renderer-commit "$RENDERER_COMMIT" \
            --renderer-contract-version "$RENDERER_CONTRACT_VERSION" \
            --bundle-root production-bundles \
            --output "$BASELINE"
          BUNDLE_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["handoff"]["bundle_id"])' "$BASELINE")"
          MANIFEST_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["handoff"]["manifest_sha256"])' "$BASELINE")"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload immutable renderer handoff
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-handoff-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-production-${{ env.EPISODE_DATE }}
          path: |
            working/${{ env.EPISODE_DATE }}/
            research/${{ env.EPISODE_DATE }}/
            episodes/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
            verification/${{ env.EPISODE_DATE }}/
            production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: warn
          retention-days: 14
