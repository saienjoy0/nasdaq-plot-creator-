name: ChatGPT Daily Preview Production

on:
  push:
    branches: [main]
    paths:
      - "daily-production-requests/*.json"

permissions:
  contents: read

jobs:
  produce-preview-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve requested episode date
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only HEAD^ HEAD | grep -E '^daily-production-requests/[0-9]{4}-[0-9]{2}-[0-9]{2}[^/]*\.json$' || true)
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one daily production request JSON must change per production commit"
            printf 'changed=%s\n' "${CHANGED[*]:-<none>}"
            exit 1
          fi
          REQUEST="${CHANGED[0]}"
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "$REQUEST")"
          CONFIRMATION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["confirmation"])' "$REQUEST")"
          SEMANTIC_FREEZE_PATH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["semanticFreeze"]["path"])' "$REQUEST")"
          SEMANTIC_FREEZE_SHA256="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["semanticFreeze"]["sha256"])' "$REQUEST")"
          test "$CONFIRMATION" = "PREVIEW"
          test -d "daily-authoring-parts/$EPISODE_DATE"
          test -f "daily-inputs/$EPISODE_DATE/daily_source_package_$EPISODE_DATE.md"
          test "$SEMANTIC_FREEZE_PATH" = "semantic-freezes/$EPISODE_DATE.json"
          [[ "$SEMANTIC_FREEZE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$SEMANTIC_FREEZE_PATH"
          ACTUAL_FREEZE_SHA256="$(sha256sum "$SEMANTIC_FREEZE_PATH" | awk '{print $1}')"
          if [[ "$ACTUAL_FREEZE_SHA256" != "$SEMANTIC_FREEZE_SHA256" ]]; then
            echo "::error::Production request semantic freeze SHA mismatch"
            exit 1
          fi
          echo "EPISODE_DATE=$EPISODE_DATE" >> "$GITHUB_ENV"
          echo "REQUEST_PATH=$REQUEST" >> "$GITHUB_ENV"
          echo "SEMANTIC_FREEZE_PATH=$SEMANTIC_FREEZE_PATH" >> "$GITHUB_ENV"
          echo "SEMANTIC_FREEZE_SHA256=$SEMANTIC_FREEZE_SHA256" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semantic verification dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check jsonschema referencing

      - name: Verify committed ChatGPT semantic freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/chatgpt_semantic_freeze.py --repo-root . verify \
            --date "$EPISODE_DATE" \
            --manifest "$SEMANTIC_FREEZE_PATH"

      - name: Verify current Editorial Semantic Acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["contractVersion"])')" = "1.2.0"
          ACCEPTANCE_PATH="$(python3 -c 'import json,os; print(json.load(open(os.environ["SEMANTIC_FREEZE_PATH"], encoding="utf-8"))["editorialSemanticAcceptance"]["path"])')"
          python3 scripts/validate_editorial_semantic_boundary.py --repo-root . --date "$EPISODE_DATE" --verify "$ACCEPTANCE_PATH"

      - name: Resolve canonical Renderer binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          value=json.loads(Path('contracts/renderer_binding.json').read_text(encoding='utf-8'))
          renderer=value['renderer']
          print('RENDERER_COMMIT='+renderer['commit'])
          print('RENDERER_CONTRACT_VERSION='+renderer['contractVersion'])
          print('VISUAL_INTELLIGENCE_BRIDGE_VERSION='+value['bridgeContractVersion'])
          PY

      - name: Checkout pinned Remotion renderer
        uses: actions/checkout@v6
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install production dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check jsonschema referencing pytest pillow playwright==1.61.0
          python -m playwright install --with-deps chromium
          npm --prefix .renderer ci

      - name: Materialize packed Research Acquisition evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          date=os.environ['EPISODE_DATE']
          evidence_dir=Path('research') / date / 'evidence'
          if evidence_dir.is_dir():
              for packed in sorted(evidence_dir.glob('*.json.zlib.b64')):
                  target=Path(str(packed)[:-len('.zlib.b64')])
                  target.write_bytes(zlib.decompress(base64.b64decode(packed.read_text(encoding='ascii').strip(), validate=True)))
                  print(f'materialized {target}')
          PY

      - name: Run canonical current production facade
        id: closure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/current_production_facade_v12.py \
            --workspace . \
            --renderer-root "$NASDAQ_CAFE_RENDERER_ROOT" \
            closure \
            --episode-date "$EPISODE_DATE" \
            --phase compile \
            --semantic-freeze "$SEMANTIC_FREEZE_PATH" \
            --build-handoff-on-pass \
            --bundle-root production-bundles \
            --plot-commit "$GITHUB_SHA" \
            2>&1 | tee "verification/$EPISODE_DATE/current-facade-v12.log"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          date=os.environ['EPISODE_DATE']
          path=Path('verification') / date / 'current_production_facade_outcome.json'
          if not path.is_file():
              raise SystemExit('current production facade outcome missing')
          value=json.loads(path.read_text(encoding='utf-8'))
          status=value.get('status')
          if status == 'PASS':
              if value.get('previewHandoffReady') is not True:
                  raise SystemExit('PASS facade outcome must include immutable handoff')
              print('continue=true')
          elif status in {'PREPARED', 'REVIEW_REQUIRED'}:
              print('continue=false')
          else:
              raise SystemExit(f'unexpected current facade status: {status!r}')
          print(f'status={status}')
          PY

      - name: Record immutable baseline
        if: steps.closure.outputs.continue == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/record_visual_source_baseline.py \
            --repo-root . \
            --episode-date "$EPISODE_DATE" \
            --plot-commit "$GITHUB_SHA" \
            --renderer-commit "$RENDERER_COMMIT" \
            --renderer-contract-version "$RENDERER_CONTRACT_VERSION" \
            --bundle-root production-bundles \
            --output "verification/$EPISODE_DATE/visual_source_baseline.json"

      - name: Upload immutable renderer handoff
        id: handoff_upload
        if: steps.closure.outputs.continue == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-handoff-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write canonical Preview production outcome
        if: always() && env.EPISODE_DATE != '' && env.RENDERER_COMMIT != ''
        shell: bash
        env:
          HANDOFF_UPLOAD_OUTCOME: ${{ steps.handoff_upload.outcome }}
          HANDOFF_ARTIFACT_ID: ${{ steps.handoff_upload.outputs.artifact-id }}
          HANDOFF_ARTIFACT_URL: ${{ steps.handoff_upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          args=(
            --closure-gate "verification/$EPISODE_DATE/renderer_closure_gate_v12.json"
            --schema contracts/preview_production_outcome.schema.json
            --output "verification/$EPISODE_DATE/preview_production_outcome.json"
            --episode-date "$EPISODE_DATE"
            --plot-commit "$GITHUB_SHA"
            --renderer-commit "$RENDERER_COMMIT"
            --handoff-upload-outcome "${HANDOFF_UPLOAD_OUTCOME:-skipped}"
          )
          if [[ "${HANDOFF_UPLOAD_OUTCOME:-}" == "success" ]]; then
            args+=(--handoff-artifact-name "nasdaq-cafe-handoff-$EPISODE_DATE-${{ github.run_id }}")
            [[ -z "${HANDOFF_ARTIFACT_ID:-}" ]] || args+=(--handoff-artifact-id "$HANDOFF_ARTIFACT_ID")
            [[ -z "${HANDOFF_ARTIFACT_URL:-}" ]] || args+=(--handoff-artifact-url "$HANDOFF_ARTIFACT_URL")
          fi
          python3 scripts/write_preview_production_outcome.py "${args[@]}"

      - name: Summarize canonical Preview production outcome
        if: always() && env.EPISODE_DATE != ''
        shell: bash
        run: |
          set -euo pipefail
          OUTCOME="verification/$EPISODE_DATE/preview_production_outcome.json"
          if [[ -f "$OUTCOME" ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          path=Path('verification') / os.environ['EPISODE_DATE'] / 'preview_production_outcome.json'
          value=json.loads(path.read_text(encoding='utf-8'))
          print('### NASDAQ Cafe canonical Preview production state')
          print()
          print(f"State: `{value['state']}`")
          print()
          if value.get('requiredAction'):
              print(f"Required action: `{value['requiredAction']}`")
              print()
          if value.get('reason'):
              print(f"Reason: {value['reason']}")
              print()
          print(f"Preview handoff ready: `{str(value['previewHandoffReady']).lower()}`")
          print()
          print(f"Semantic freeze: `{os.environ['SEMANTIC_FREEZE_SHA256']}`")
          print()
          print('Canonical Plot entry: `scripts/current_production_facade_v12.py`')
          print('Canonical Renderer request: `.github/workflows/nasdaq-cafe-handoff-preview-request-v3.yml`')
          PY
          fi

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-production-${{ env.EPISODE_DATE }}
          path: |
            working/${{ env.EPISODE_DATE }}/
            research/${{ env.EPISODE_DATE }}/
            episodes/${{ env.EPISODE_DATE }}/
            render-specs/${{ env.EPISODE_DATE }}/render_spec.json
            verification/${{ env.EPISODE_DATE }}/
            semantic-freezes/${{ env.EPISODE_DATE }}.json
            production-bundles/${{ env.EPISODE_DATE }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload canonical Preview outcome
        if: always() && env.EPISODE_DATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-preview-outcome-${{ env.EPISODE_DATE }}
          path: verification/${{ env.EPISODE_DATE }}/preview_production_outcome.json
          if-no-files-found: warn
          retention-days: 14
