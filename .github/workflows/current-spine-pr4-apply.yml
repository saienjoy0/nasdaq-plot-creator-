name: Current Spine PR-4 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/apply_pr4.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr4' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply canonical current facade migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/apply_pr4.py
          python3 -m py_compile scripts/current_production_facade_v12.py tests/current-spine/test_current_production_facade_contract.py
          python3 tests/current-spine/test_current_production_facade_contract.py
          rm -f .current-spine/apply_pr4.py .github/workflows/current-spine-pr4-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-4: route current lanes through canonical facade"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
