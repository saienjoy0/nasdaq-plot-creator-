name: Current Preview Final Request Builders CI

on:
  pull_request:
    paths:
      - "scripts/build_current_preview_request_v4.py"
      - "scripts/build_current_preview_publication.py"
      - "scripts/build_current_final_request_v2.py"
      - "tests/current-spine/test_current_preview_final_request_builders.py"
      - "tests/current-spine/test_current_preview_publication.py"
      - ".github/workflows/current-preview-final-request-builders-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Preview/Final request construction
        env:
          PYTHONPATH: scripts
        run: python3 tests/current-spine/test_current_preview_final_request_builders.py
      - name: Validate idempotent Current Preview publication identity
        env:
          PYTHONPATH: scripts
        run: python3 tests/current-spine/test_current_preview_publication.py
      - name: Syntax and diff hygiene
        run: |
          python3 -m py_compile scripts/build_current_preview_request_v4.py scripts/build_current_preview_publication.py scripts/build_current_final_request_v2.py tests/current-spine/test_current_preview_final_request_builders.py tests/current-spine/test_current_preview_publication.py
          git diff --check
