name: Real-Day Acceptance

on:
  pull_request:
    paths:
      - "scripts/run_real_day_acceptance.py"
      - "skills/nasdaq-cafe-real-day-acceptance/**"
      - "tests/real-day-acceptance/**"
      - "designs/PR11_REAL_DAY_END_TO_END_ACCEPTANCE.md"
      - ".github/workflows/real-day-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_real_day_acceptance.py"
      - "skills/nasdaq-cafe-real-day-acceptance/**"
      - "tests/real-day-acceptance/**"
      - "designs/PR11_REAL_DAY_END_TO_END_ACCEPTANCE.md"
      - ".github/workflows/real-day-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile acceptance runner
        run: python -m py_compile scripts/run_real_day_acceptance.py
      - name: Parse report schema
        run: python -m json.tool skills/nasdaq-cafe-real-day-acceptance/contracts/real_day_acceptance_report.schema.json >/dev/null
      - name: Run PR11 tests
        run: python -m unittest discover -s tests/real-day-acceptance -p 'test_*.py' -v
      - name: Run PR10 regression
        run: python -m unittest discover -s tests/renderer-handoff -p 'test_*.py' -v
      - name: Run PR9 regression
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python -m unittest discover -s tests/final-production-package -p 'test_*.py' -v
