name: Temporary Qualification Semantic Import

on:
  push:
    branches:
      - qualification/2026-09-03-semantic-freeze
    paths:
      - .qualification-payload/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/2026-09-03-semantic-freeze
          fetch-depth: 0
      - name: Import and verify exact semantic payload
        shell: bash
        run: |
          set -euo pipefail
          cat .qualification-payload/chunk-* | base64 --decode > "$RUNNER_TEMP/semantic.tar.xz"
          echo "8f51ae8f82fa34457842e0868dc96d0cfebfe7d46da95b34a00d287aaaf5f03d  $RUNNER_TEMP/semantic.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/semantic.tar.xz"
          python scripts/chatgpt_semantic_freeze.py --repo-root . verify --date 2026-09-03 --manifest semantic-freezes/2026-09-03.json
          python scripts/validate_chatgpt_daily_authoring_closure.py --authoring daily-authoring/2026-09-03.json --registry contracts/financial_recipe_registry.json --json-output verification/2026-09-03/authoring_renderer_closure.json
          python scripts/validate_editorial_semantic_boundary.py --date 2026-09-03 --repo-root . --authoring daily-authoring/2026-09-03.json --output verification/2026-09-03/editorial_semantic_acceptance.json
          python scripts/chatgpt_semantic_freeze.py --repo-root . verify --date 2026-09-03 --manifest semantic-freezes/2026-09-03.json
          rm -rf .qualification-payload
          rm -f .github/workflows/temporary-qualification-semantic-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Qualification: freeze 2026-09-03 semantic authority"
          git push origin HEAD:qualification/2026-09-03-semantic-freeze
