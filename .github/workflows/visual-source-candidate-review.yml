name: Visual Source Candidate Review

on:
  pull_request:
    paths:
      - "working/**/visual_source_intents.json"
      - "working/**/visual_source_selection.json"
      - "scripts/prepare_visual_sources.py"
      - "scripts/resolve_visual_sources.py"
      - "scripts/select_visual_sources.py"
      - "scripts/visual_source_contract.py"
      - "scripts/visual_source_projection.py"
      - ".github/workflows/visual-source-candidate-review.yml"
  workflow_dispatch:
    inputs:
      episode_date:
        description: "YYYY-MM-DD"
        required: true
        default: "2026-08-06"
        type: string

permissions:
  contents: read

jobs:
  review-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EPISODE_DATE: ${{ inputs.episode_date || '2026-08-06' }}
      RENDERER_COMMIT: 36440cbe84331d020d4fe808d5c2fcbcac20833c
      NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer
    steps:
      - uses: actions/checkout@v6

      - name: Validate requested date and explicit Visual Evidence plan
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error::episode_date must be YYYY-MM-DD"
            exit 1
          }
          intent_path="working/$EPISODE_DATE/visual_source_intents.json"
          if [[ ! -s "$intent_path" ]]; then
            echo "::error::E_VISUAL_SOURCE_PLANNING_MISSING: $intent_path is required even when no Visual Source is needed"
            exit 1
          fi
          intent_count="$(python - "$intent_path" "$EPISODE_DATE" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          date = sys.argv[2]
          doc = json.loads(path.read_text(encoding="utf-8"))
          if doc.get("contractVersion") != "1.0.0":
              raise SystemExit("Visual Source contractVersion must be 1.0.0")
          if doc.get("episodeDate") != date:
              raise SystemExit("Visual Source intent episodeDate mismatch")
          intents = doc.get("intents")
          if not isinstance(intents, list):
              raise SystemExit("Visual Source intents must be an array")
          print(len(intents))
          PY
          )"
          if [[ "$intent_count" == "0" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Visual Source candidate review"
              echo "- Episode: \`$EPISODE_DATE\`"
              echo "- Status: not-required (explicit Visual Evidence plan has zero intents)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -s "working/$EPISODE_DATE/visual_source_selection.json" || {
            echo "::error::Visual Source selection is required when intents exist for $EPISODE_DATE"
            exit 1
          }
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned renderer contract source
        if: steps.guard.outputs.active == 'true'
        uses: actions/checkout@v6
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: ${{ env.RENDERER_COMMIT }}
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Install exact-locator capture dependencies
        if: steps.guard.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema \
            pillow \
            playwright==1.61.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Resolve Primary and Approved Fallback candidates
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "verification/$EPISODE_DATE"
          python scripts/prepare_visual_sources.py \
            --date "$EPISODE_DATE" \
            --repo-root . \
            | tee "verification/$EPISODE_DATE/visual-source-candidate-review.log"

      - name: Summarize candidate states
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          date = os.environ["EPISODE_DATE"]
          raw = Path(f"verification/{date}/asset_resolution_raw.json")
          if not raw.is_file():
              raise SystemExit(0)
          doc = json.loads(raw.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Visual Source candidate review\n")
              out.write(f"- Episode: `{date}`\n")
              for item in doc.get("results", []):
                  out.write(
                      f"- `{item.get('intentId')}` / `{item.get('path')}`: "
                      f"`{item.get('status')}` rights=`{item.get('rightsStatus')}` "
                      f"asset=`{item.get('assetId')}`\n"
                  )
          PY

      - name: Upload Primary/Fallback review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-source-candidates-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: |
            daily-assets/${{ env.EPISODE_DATE }}/
            verification/${{ env.EPISODE_DATE }}/asset_resolution_raw.json
            verification/${{ env.EPISODE_DATE }}/asset_resolution_log.json
            verification/${{ env.EPISODE_DATE }}/visual-source-candidate-review.log
            working/${{ env.EPISODE_DATE }}/visual_source_selected_assets.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
