name: Current Spine PR-3 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".current-spine/apply_pr3.py"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/current-spine-pr3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply PR-3 exact read-set binding
        shell: bash
        run: |
          set -euo pipefail
          python3 .current-spine/apply_pr3.py
          python3 -m py_compile scripts/run_visual_intelligence_v12.py scripts/visual_intelligence_read_set_v12.py tests/current-spine/test_visual_intelligence_read_set_v12.py
          python3 tests/current-spine/test_visual_intelligence_read_set_v12.py
          rm -f .current-spine/apply_pr3.py .github/workflows/current-spine-pr3-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR-3: bind exact direct read-set lineage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
