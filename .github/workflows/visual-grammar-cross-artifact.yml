name: Visual Grammar Cross Artifact
# VG-5 verifies byte mirrors, independent report recomputation, immutable handoff,
# and Final Episode Contract 1.1.0 Beat-level Grammar closure.

on:
  pull_request:
    paths:
      - "contracts/renderer_binding.json"
      - "contracts/visual_grammar_*.json"
      - "contracts/final_episode_contract.schema.json"
      - "scripts/renderer_binding.py"
      - "scripts/visual_grammar_cross_artifact.py"
      - "scripts/visual_grammar_report_recompute.py"
      - "scripts/visual_grammar_contract_closure.py"
      - "tests/visual-grammar-cross-artifact/**"
      - "tests/visual-grammar-contract-closure/**"
      - ".github/workflows/visual-grammar-cross-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.0
      - name: Resolve canonical Renderer binding
        run: python scripts/renderer_binding.py --repo-root . --github-env "$GITHUB_ENV"
      - name: Verify renderer contract mirrors are byte-identical
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          binding = json.loads(Path("contracts/renderer_binding.json").read_text(encoding="utf-8"))
          commit = binding["rendererCommit"]
          if commit != os.environ["RENDERER_COMMIT"]:
              raise SystemExit("canonical Renderer binding environment mismatch")
          root = (
              "https://raw.githubusercontent.com/saienjoy0/"
              f"saienjoy0-nasdaq-cafe-remotion/{commit}"
          )
          files = (
              "contracts/visual_grammar_timing_report.schema.json",
              "contracts/visual_grammar_renderer_compatibility.json",
          )
          for relative in files:
              expected = urlopen(f"{root}/{relative}", timeout=30).read()
              actual = Path(relative).read_bytes()
              if actual != expected:
                  raise SystemExit(f"renderer mirror mismatch: {relative}")
              print(f"PASS: byte-identical renderer mirror {relative}")
          PY
      - name: Run Visual Grammar semantic contract regression
        run: python -m unittest tests/test_visual_grammar_contract.py -v
      - name: Run Final Contract to render_spec closure tests
        run: |
          python -m unittest discover \
            -s tests/visual-grammar-contract-closure \
            -p "test_*.py" -v
      - name: Run Visual Grammar cross-artifact tests
        run: python -m unittest discover -s tests/visual-grammar-cross-artifact -p "test_*.py" -v
