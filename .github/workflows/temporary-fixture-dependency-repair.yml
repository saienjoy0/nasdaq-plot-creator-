name: Temporary Fixture Dependency Repair

on:
  push:
    branches:
      - fix/current-preview-readiness-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-preview-readiness-gate
          fetch-depth: 0
      - name: Apply exact fixture dependency repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          closure = Path('scripts/validate_chatgpt_daily_authoring_closure.py')
          text = closure.read_text(encoding='utf-8')
          old = '''import argparse\nimport json\nimport re\nfrom pathlib import Path\nfrom typing import Any\n\nimport remotion_template_variant\n'''
          new = '''import argparse\nimport json\nimport re\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\nSCRIPT_DIR = Path(__file__).resolve().parent\nif str(SCRIPT_DIR) not in sys.path:\n    sys.path.insert(0, str(SCRIPT_DIR))\n\nimport remotion_template_variant\n'''
          if old not in text:
              raise SystemExit('closure import target not found')
          closure.write_text(text.replace(old, new, 1), encoding='utf-8')

          fixture = Path('tests/editorial-semantic-boundary/current_fixture.py')
          text = fixture.read_text(encoding='utf-8')
          old = '''        "scripts/materialize_causal_research.py",\n        "scripts/validate_editorial_semantic_boundary.py",\n'''
          new = '''        "scripts/materialize_causal_research.py",\n        "scripts/remotion_template_variant.py",\n        "scripts/validate_editorial_semantic_boundary.py",\n'''
          if old not in text:
              raise SystemExit('fixture copy target not found')
          fixture.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temporary-fixture-dependency-repair.yml
          git diff --check
          git diff -- scripts/validate_chatgpt_daily_authoring_closure.py tests/editorial-semantic-boundary/current_fixture.py
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_chatgpt_daily_authoring_closure.py tests/editorial-semantic-boundary/current_fixture.py .github/workflows/temporary-fixture-dependency-repair.yml
          git commit -m 'Repair synthetic runtime dependency wiring'
          git push origin HEAD:fix/current-preview-readiness-gate
