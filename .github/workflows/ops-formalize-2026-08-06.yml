name: Formalize 2026-08-06 Episode

on:
  push:
    branches:
      - feat/formalize-2026-08-06-episode
    paths:
      - .github/workflows/ops-formalize-2026-08-06.yml

permissions:
  contents: write

concurrency:
  group: formalize-2026-08-06-episode
  cancel-in-progress: false

env:
  EPISODE_DATE: "2026-08-06"
  EXPECTED_BASE_FINAL_SHA256: "0dcd2894f40b3d03361125f70d2d7dc35f2fe674f6d01629b5e87b74b9a41bbf"
  EXPECTED_RENDER_SHA256: "37fa6db251261326deacdf1e4b68238a1ca18d09ac88be7dd2cfe55449640076"
  EXPECTED_FORMAL_FINAL_SHA256: "eac23d2a2e352fb92158b95ed52202a5f76176e391536ca30739f5c477b06df3"
  NASDAQ_CAFE_RENDERER_ROOT: ${{ github.workspace }}/.renderer

jobs:
  formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plot source
        uses: actions/checkout@v4
        with:
          ref: feat/formalize-2026-08-06-episode
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned Remotion renderer
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/saienjoy0-nasdaq-cafe-remotion
          ref: 750f993bd00cf2f67fdb4ab18907e82ed0dc68df
          path: .renderer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .renderer/package-lock.json

      - name: Install pinned renderer dependencies
        working-directory: .renderer
        run: npm ci

      - name: Install local validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Materialize the already-reviewed episode without TTS or model calls
        run: python scripts/materialize_daily_episode.py --date "$EPISODE_DATE" --repo-root .

      - name: Verify exact validated materialization identity
        shell: bash
        run: |
          set -euo pipefail
          FINAL="episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
          RENDER="render-specs/$EPISODE_DATE/render_spec.json"
          FINAL_SHA="$(sha256sum "$FINAL" | awk '{print $1}')"
          RENDER_SHA="$(sha256sum "$RENDER" | awk '{print $1}')"
          [[ "$FINAL_SHA" == "$EXPECTED_BASE_FINAL_SHA256" ]] || {
            echo "::error::base formal package SHA mismatch expected=$EXPECTED_BASE_FINAL_SHA256 actual=$FINAL_SHA"
            exit 1
          }
          [[ "$RENDER_SHA" == "$EXPECTED_RENDER_SHA256" ]] || {
            echo "::error::render spec SHA mismatch expected=$EXPECTED_RENDER_SHA256 actual=$RENDER_SHA"
            exit 1
          }
          echo "validated materialization identity matched run167"

      - name: Promote validated package to formal current status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          date = "2026-08-06"
          path = Path(f"episodes/{date}/episode_package_{date}.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "- render_spec validator：未実行。ローカル構造・整合検査pass、正式CI待ち":
                  "- render_spec validator：PASS。renderer_validation_report.json = PASS。",
              "- episode_package・render_spec整合：ローカルpass":
                  "- episode_package・render_spec整合：PASS。production_consistency_report.json = pass、Scene 1〜9のナレーション一致を確認。",
              "- 素材不足と停止事項：正式validatorのCI検証対象。previewはvalidator合格後にのみ実行する。":
                  "- 素材不足と停止事項：未解決なし。正式validatorはPASS。PreviewはTTS未生成のため未実行。",
              "- 実行正本整合ゲート：ローカルpass。正式CIで再検証する。":
                  "- 実行正本整合ゲート：PASS。正式CIで再検証済み。",
              "- GitHub Actionsへ渡す条件：正式validator合格後にpreviewへ進む。":
                  "- GitHub Actionsへ渡す条件：正式validatorは合格済み。TTS準備後にPreviewへ進み、FinalはPreview目視確認後の明示依頼時のみ。",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"formal status anchor missing: {old}")
              text = text.replace(old, new, 1)

          marker = "<!--BEGIN_FINANCIAL_VISUAL_CONTRACT_1_0-->"
          if marker not in text:
              raise SystemExit("financial visual annex marker missing")
          section = '''## I. 正式化・実行正本ステータス

- 正式状態：post-inquisition / validator-pass
- 正式episode package：episodes/2026-08-06/episode_package_2026-08-06.md
- 実行render spec：render-specs/2026-08-06/render_spec.json
- render_spec SHA-256：37fa6db251261326deacdf1e4b68238a1ca18d09ac88be7dd2cfe55449640076
- Story Engine projection：PASS
- render_spec validator：PASS
- episode_package・render_spec整合：PASS
- financial visual consistency：PASS
- visual grammar structural validation：PASS
- 当日固有画像：not-required / unresolved 0
- 04 興味深さ・わかりやすさ審問：PASS 29/30
- Story Engine review：PASS 27/30 / repository_provenance
- external Independent Critic：not_certified
- critic_certified：false
- attestation_strength：repository_provenance
- Daily Production policy：external_critic_optional
- 留保：上記Story Engine reviewは、実在する外部Independent Criticの実行証明ではない。外部Criticを実行したものとして扱わない。
- Preview：未実行。TTS未生成のため、課金要素を伴う音声生成は行っていない。
- Final render：未承認。Previewの目視確認後、ユーザーの明示依頼がある場合だけ進む。

'''
          text = text.replace(marker, section + marker, 1)
          path.write_text(text, encoding="utf-8")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "eac23d2a2e352fb92158b95ed52202a5f76176e391536ca30739f5c477b06df3"
          if actual != expected:
              raise SystemExit(f"patched formal package SHA mismatch expected={expected} actual={actual}")
          print(f"formal package sha256={actual}")
          PY

      - name: Commit only formal source-of-truth artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "episodes/$EPISODE_DATE/episode_package_$EPISODE_DATE.md" \
            "render-specs/$EPISODE_DATE/render_spec.json"
          git diff --cached --check
          git diff --cached --quiet && {
            echo "::error::no formalization diff produced"
            exit 1
          }
          git commit -m "Promote 2026-08-06 Story Engine episode to formal source"
          git push origin HEAD:feat/formalize-2026-08-06-episode
