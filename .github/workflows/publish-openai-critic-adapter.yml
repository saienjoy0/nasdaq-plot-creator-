name: Publish OpenAI Critic Adapter

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Critic adapter releases are allowed only from main" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push immutable release candidate
        id: publish
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/nasdaq-cafe-openai-critic"
          TAG="sha-${GITHUB_SHA}"
          docker build -t "${IMAGE}:${TAG}" critic-adapters/openai
          docker push "${IMAGE}:${TAG}"
          REPO_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          case "$REPO_DIGEST" in
            *@sha256:*) ;;
            *) echo "registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          printf '%s\n' "$REPO_DIGEST" > critic_adapter_image.txt
          python - <<'PY'
          import json, os
          digest = open('critic_adapter_image.txt', encoding='utf-8').read().strip()
          payload = {
              'contract_version': '1.0.0',
              'source_commit': os.environ['GITHUB_SHA'],
              'source_ref': os.environ['GITHUB_REF_NAME'],
              'image': digest,
              'model_api_invoked': False,
          }
          with open('critic_adapter_release.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: openai-critic-adapter-${{ github.sha }}
          path: |
            critic_adapter_image.txt
            critic_adapter_release.json
          if-no-files-found: error
