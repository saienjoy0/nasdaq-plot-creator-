name: Readiness Gate TDD Temp

on:
  pull_request:
    paths:
      - "tests/current-spine/test_current_preview_request_readiness.py"
      - "scripts/current_preview_request_readiness_v12.py"
      - ".github/workflows/readiness-gate-tdd-temp.yml"

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run readiness regression
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q tests/current-spine/test_current_preview_request_readiness.py
